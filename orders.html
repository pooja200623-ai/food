<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Crave</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body class="dashboard-body">

    <!-- Navbar -->
    <nav class="dash-nav"></nav>

    <main class="dashboard-container reveal" style="padding-top: 120px; max-width: 1000px; margin: 0 auto; padding-bottom: 80px;">
        <div style="margin-bottom: 3rem; text-align: center;">
            <h1 style="font-size: 3rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 0.5rem; color: var(--text-main);">My <span style="background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Orders</span></h1>
            <p style="color: var(--text-muted); font-size: 1.1rem;">Track and manage your delicious journey with Crave.</p>
        </div>
        
        <div id="ordersList" style="display: flex; flex-direction: column; gap: 2rem;">
            <!-- Loading state -->
            <div style="text-align: center; padding: 3rem;">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--primary-color);"></i>
                <p style="margin-top: 1rem; color: #666;">Fetching your orders...</p>
            </div>
        </div>

        <div id="emptyOrdersMessage" style="display: none; background: white; padding: 4rem 2rem; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
            <i class="fas fa-box-open" style="font-size: 5rem; color: #eee; margin-bottom: 1.5rem;"></i>
            <h2>No Orders Yet</h2>
            <p style="color: #666; margin-bottom: 2.5rem;">Hungry? Place your first order today!</p>
            <a href="index.html" class="btn-primary" style="text-decoration: none; padding: 12px 30px;">Order Now</a>
        </div>
    </main>

    <div id="toastContainer"></div>

    <div id="footerContainer"></div>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const session = JSON.parse(localStorage.getItem('user_session'));
            if (!session) { window.location.replace('signin.html'); return; }

            const ordersList = document.getElementById('ordersList');
            const emptyOrdersMessage = document.getElementById('emptyOrdersMessage');

            async function fetchOrders() {
                try {
                    const response = await fetch(`api/orders.php?action=get_orders&email=${encodeURIComponent(session.email)}`);
                    const data = await response.json();

                    if (data.success && data.data.length > 0) {
                        ordersList.innerHTML = data.data.map(order => {
                            const statusColors = {
                                'Pending': { bg: '#fff4e6', text: '#d9480f' },
                                'Preparing': { bg: '#e7f5ff', text: '#1971c2' },
                                'Out for Delivery': { bg: '#f3f0ff', text: '#6741d9' },
                                'Delivered': { bg: '#ebfbee', text: '#2b8a3e' },
                                'Cancelled': { bg: '#fff5f5', text: '#c92a2a' }
                            };
                            const status = statusColors[order.order_status] || { bg: '#f1f3f5', text: '#495057' };
                            
                            return `
                            <div style="background: white; border-radius: 24px; box-shadow: var(--shadow-soft); overflow: hidden; margin-bottom: 2.5rem; border: 1px solid rgba(0,0,0,0.02); transition: 0.3s;" onmouseover="this.style.transform='translateY(-5px)';this.style.boxShadow='var(--shadow-premium)'" onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='var(--shadow-soft)'">
                                <div style="background: #fafafa; padding: 1.8rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f2f6;">
                                    <div>
                                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 4px;">
                                            <span style="color: #adb5bd; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Order ID:</span>
                                            <span style="font-weight: 800; color: var(--text-main); font-size: 1.1rem;">#${order.id}</span>
                                        </div>
                                        <div style="color: #adb5bd; font-size: 0.85rem;"><i class="far fa-calendar-alt"></i> ${new Date(order.created_at).toLocaleString()}</div>
                                    </div>
                                    <div style="text-align: right;">
                                        <span style="background: ${status.bg}; color: ${status.text}; padding: 6px 18px; border-radius: 50px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; border: 1px solid rgba(0,0,0,0.05);">${order.order_status}</span>
                                        <div style="font-weight: 900; margin-top: 8px; font-size: 1.4rem; color: var(--text-main);">₹${order.total_price}</div>
                                    </div>
                                </div>
                                <div style="padding: 2rem;">
                                    <div style="display: flex; flex-direction: column; gap: 1.2rem;">
                                        ${order.items.map(item => `
                                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                                <div style="display: flex; align-items: center; gap: 15px;">
                                                    <div style="background: var(--bg-color); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 0.85rem; font-weight: 800; color: var(--primary-color); border: 1px solid #eee;">${item.quantity}x</div>
                                                    <span style="font-weight: 600; color: var(--text-main); font-size: 1.05rem;">${item.food_name}</span>
                                                </div>
                                                <div style="font-weight: 700; color: var(--text-muted);">₹${item.price * item.quantity}</div>
                                            </div>
                                        `).join('')}
                                    </div>

                                    <div style="margin-top: 2rem; padding: 1.5rem; background: #f8f9fa; border-radius: 18px; font-size: 0.95rem; border: 1px solid #f1f2f6;">
                                        <div style="margin-bottom: 0.8rem; display: flex; gap: 12px; color: var(--text-main);">
                                            <i class="fas fa-map-marker-alt" style="color: var(--primary-color); margin-top: 3px;"></i> 
                                            <div><strong style="display: block; font-size: 0.75rem; color: #adb5bd; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px;">Delivery to</strong> ${order.delivery_address}</div>
                                        </div>
                                        <div style="display: flex; gap: 12px; color: var(--text-main);">
                                            <i class="fas fa-credit-card" style="color: var(--primary-color); margin-top: 3px;"></i> 
                                            <div><strong style="display: block; font-size: 0.75rem; color: #adb5bd; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px;">Paid via</strong> ${order.payment_method.toUpperCase()}</div>
                                        </div>
                                    </div>

                                    <div style="margin-top: 2rem; display: flex; gap: 12px;">
                                        <button class="btn-primary" style="flex: 1; padding: 14px; font-size: 0.95rem; background: #fff; color: var(--text-main); border: 2px solid #eee; border-radius: 15px;" onclick="showToast('Tracking coming soon!', 'info')"><i class="fas fa-route"></i> Track Live</button>
                                        <button class="btn-primary" style="flex: 1; padding: 14px; font-size: 0.95rem; border-radius: 15px;" onclick="location.href='menu.html'"><i class="fas fa-redo"></i> Order Again</button>
                                    </div>
                                </div>
                            </div>
                        `}).join('');
                    } else {
                        ordersList.style.display = 'none';
                        emptyOrdersMessage.style.display = 'block';
                    }
                } catch (error) {
                    ordersList.innerHTML = `<div style="text-align: center; padding: 2rem; color: red;">Failed to load orders. Please refresh.</div>`;
                }
            }

            fetchOrders();
        });
    </script>
</body>
</html>
