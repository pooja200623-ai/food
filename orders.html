<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Crave</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body class="dashboard-body">

    <!-- Navbar -->
    <nav class="dash-nav">
        <div class="nav-brand">
            <i class="fas fa-utensils"></i> Crave
        </div>
        
        <div class="nav-links" style="display: flex; gap: 25px; align-items: center; font-weight: 500; font-size: 1.05rem;">
            <a href="index.html" style="text-decoration: none; color: var(--text-main); transition: 0.3s;" onmouseover="this.style.color='var(--primary-color)'" onmouseout="this.style.color='var(--text-main)'">Home</a>
            <a href="index.html#menu" style="text-decoration: none; color: var(--text-main); transition: 0.3s;" onmouseover="this.style.color='var(--primary-color)'" onmouseout="this.style.color='var(--text-main)'">Our Menu</a>
            <a href="cart.html" style="text-decoration: none; color: var(--text-main); transition: 0.3s; position: relative;" onmouseover="this.style.color='var(--primary-color)'" onmouseout="this.style.color='var(--text-main)'">
                Cart <i class="fas fa-shopping-cart"></i>
                <span id="cartCount" style="position: absolute; top: -10px; right: -15px; background: var(--primary-color); color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.75rem; font-weight: bold;">0</span>
            </a>
            <a href="orders.html" style="text-decoration: none; color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 5px;">Orders</a>
            <a href="profile.html" style="text-decoration: none; color: var(--text-main); transition: 0.3s;" onmouseover="this.style.color='var(--primary-color)'" onmouseout="this.style.color='var(--text-main)'">Profile</a>
        </div>

        <div class="user-profile">
            <span id="userNameDisplay">User</span>
            <div class="user-avatar" id="userAvatar">U</div>
            <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </nav>

    <main class="dashboard-container" style="padding-top: 120px; max-width: 800px; margin: 0 auto; padding-bottom: 50px;">
        <h1 style="margin-bottom: 2rem; color: var(--text-main);">My Orders</h1>
        
        <div id="ordersList" style="display: flex; flex-direction: column; gap: 2rem;">
            <!-- Loading state -->
            <div style="text-align: center; padding: 3rem;">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--primary-color);"></i>
                <p style="margin-top: 1rem; color: #666;">Fetching your orders...</p>
            </div>
        </div>

        <div id="emptyOrdersMessage" style="display: none; background: white; padding: 4rem 2rem; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
            <i class="fas fa-box-open" style="font-size: 5rem; color: #eee; margin-bottom: 1.5rem;"></i>
            <h2>No Orders Yet</h2>
            <p style="color: #666; margin-bottom: 2.5rem;">Hungry? Place your first order today!</p>
            <a href="index.html" class="btn-primary" style="text-decoration: none; padding: 12px 30px;">Order Now</a>
        </div>
    </main>

    <div id="toastContainer"></div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const session = JSON.parse(localStorage.getItem('user_session'));
            if (!session) {
                window.location.replace('signin.html');
                return;
            }

            const ordersList = document.getElementById('ordersList');
            const emptyOrdersMessage = document.getElementById('emptyOrdersMessage');

            async function fetchOrders() {
                try {
                    const response = await fetch(`api/orders.php?action=get_orders&email=${encodeURIComponent(session.email)}`);
                    const data = await response.json();

                    if (data.success && data.data.length > 0) {
                        ordersList.innerHTML = data.data.map(order => `
                            <div style="background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden;">
                                <div style="background: #f8f9fa; padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee;">
                                    <div>
                                        <span style="color: #666; font-size: 0.9rem;">Order ID:</span>
                                        <span style="font-weight: 600; margin-left: 5px;">#${order.id}</span>
                                        <div style="color: #999; font-size: 0.8rem; margin-top: 4px;">${new Date(order.created_at).toLocaleString()}</div>
                                    </div>
                                    <div style="text-align: right;">
                                        <span style="background: #e1f5fe; color: #03a9f4; padding: 5px 15px; border-radius: 50px; font-size: 0.85rem; font-weight: 600;">${order.order_status}</span>
                                        <div style="font-weight: 700; margin-top: 5px; font-size: 1.1rem;">₹${order.total_price}</div>
                                    </div>
                                </div>
                                <div style="padding: 1.5rem;">
                                    <div style="display: flex; flex-direction: column; gap: 1rem;">
                                        ${order.items.map(item => `
                                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                                <div style="display: flex; align-items: center; gap: 10px;">
                                                    <span style="background: #eee; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 0.8rem; font-weight: 600;">${item.quantity}x</span>
                                                    <span style="font-weight: 500;">${item.food_name}</span>
                                                </div>
                                                <div style="color: #666;">₹${item.price * item.quantity}</div>
                                            </div>
                                        `).join('')}
                                    </div>

                                    <div style="margin-top: 1.5rem; padding: 1rem; background: #fafafa; border-radius: 12px; font-size: 0.9rem;">
                                        <div style="margin-bottom: 0.5rem;"><i class="fas fa-map-marker-alt" style="color: var(--primary-color); width: 20px;"></i> <strong>Delivery to:</strong> ${order.delivery_address}</div>
                                        <div><i class="fas fa-credit-card" style="color: var(--primary-color); width: 20px;"></i> <strong>Paid via:</strong> ${order.payment_method.toUpperCase()}</div>
                                    </div>

                                    <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px dashed #eee; display: flex; justify-content: flex-end;">
                                        <button class="btn-primary" style="padding: 8px 20px; font-size: 0.9rem; background: #eee; color: #333;" onclick="showToast('Tracking coming soon!', 'info')">Track Order</button>
                                    </div>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        ordersList.style.display = 'none';
                        emptyOrdersMessage.style.display = 'block';
                    }
                } catch (error) {
                    ordersList.innerHTML = `<div style="text-align: center; padding: 2rem; color: red;">Failed to load orders. Please refresh.</div>`;
                }
            }

            fetchOrders();
            
            // Sync cart count
            if (typeof saveCart === 'function') {
                saveCart(getCart());
            }
        });
    </script>
</body>
</html>
