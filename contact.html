<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concierge | Crave Luxe Gastronomy</title>
    <!-- Fonts via style.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=20">
    <style>
        .contact-card {
            background: rgba(255, 255, 255, 0.02);
            padding: 3.5rem;
            border-radius: var(--radius-xl);
            display: flex;
            align-items: center;
            gap: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .contact-card:hover {
            transform: translateX(15px);
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 140, 66, 0.2);
        }
        .contact-icon {
            width: 80px;
            height: 80px;
            background: rgba(255, 140, 66, 0.1);
            color: var(--primary-color);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border: 1px solid rgba(255, 140, 66, 0.2);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .contact-form-container {
            background: rgba(255, 255, 255, 0.02);
            padding: 5.5rem;
            border-radius: var(--radius-xl);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 50px 100px rgba(0,0,0,0.5);
        }
        input, textarea {
            background: rgba(255,255,255,0.03) !important;
            border: 1px solid rgba(255,255,255,0.08) !important;
            color: white !important;
            padding: 20px !important;
            border-radius: 15px !important;
            font-family: 'Outfit', sans-serif !important;
            font-size: 1.1rem !important;
            outline: none !important;
            width: 100%;
        }
        input:focus, textarea:focus {
            border-color: var(--primary-color) !important;
            background: rgba(255,255,255,0.05) !important;
            box-shadow: 0 0 25px rgba(255, 140, 66, 0.1) !important;
        }
    </style>
</head>
<body class="dashboard-body">

    <!-- Navbar -->
    <nav class="dash-nav"></nav>

    <main class="dashboard-container reveal" style="padding-top: 15rem; max-width: 1400px; margin: 0 auto; padding-bottom: 12rem;">
        
        <div style="text-align: center; margin-bottom: 10rem;">
            <div style="background: rgba(255, 140, 66, 0.1); color: var(--primary-color); padding: 12px 35px; border-radius: 50px; display: inline-block; font-weight: 900; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 5px; margin-bottom: 3.5rem; border: 1px solid rgba(255, 140, 66, 0.2);">
                🛎️ Luxe Concierge
            </div>
            <h1 style="font-family: 'DM Serif Display', serif; font-size: 6.5rem; font-weight: 400; letter-spacing: -2px; margin-bottom: 2rem; color: white;">Connect <span style="background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">With Us</span></h1>
            <p style="font-size: 1.8rem; color: var(--text-muted); max-width: 800px; margin: 0 auto; line-height: 1.7; font-weight: 300;">Our dedicated concierge team is available 24/7 to ensure your culinary experiences are nothing short of perfection.</p>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 6rem; align-items: start;">
            <!-- Contact Info -->
            <div style="display: flex; flex-direction: column; gap: 3rem;">
                <div class="contact-card">
                    <div class="contact-icon">
                        <i class="fas fa-phone-alt"></i>
                    </div>
                    <div>
                        <h4 style="font-family: 'DM Serif Display', serif; font-size: 1.8rem; margin-bottom: 0.5rem; color: white; font-weight: 400;">Luxe Hotline</h4>
                        <p style="color: var(--text-muted); font-weight: 400; font-size: 1.1rem; letter-spacing: 1px;">+1 (555) 000-LUXE</p>
                    </div>
                </div>
                <div class="contact-card">
                    <div class="contact-icon" style="color: var(--accent-color); border-color: rgba(249, 200, 14, 0.2); background: rgba(249, 200, 14, 0.05);">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div>
                        <h4 style="font-family: 'DM Serif Display', serif; font-size: 1.8rem; margin-bottom: 0.5rem; color: white; font-weight: 400;">Concierge Email</h4>
                        <p style="color: var(--text-muted); font-weight: 400; font-size: 1.1rem; letter-spacing: 1px;">hello@craveluxe.com</p>
                    </div>
                </div>
                <div class="contact-card">
                    <div class="contact-icon" style="color: #2ed573; border-color: rgba(46, 213, 115, 0.2); background: rgba(46, 213, 115, 0.05);">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
                    <div>
                        <h4 style="font-family: 'DM Serif Display', serif; font-size: 1.8rem; margin-bottom: 0.5rem; color: white; font-weight: 400;">The Sanctuary</h4>
                        <p style="color: var(--text-muted); font-weight: 400; font-size: 1.1rem; letter-spacing: 1px;">777 Gourmet Plaza, Elite City</p>
                    </div>
                </div>
            </div>

            <!-- Contact Form -->
            <div class="contact-form-container">
                <form id="contactForm">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; margin-bottom: 3rem;">
                        <div>
                            <label style="display: block; margin-bottom: 1.2rem; font-weight: 700; color: var(--primary-color); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 3px;">Full Distinction</label>
                            <input type="text" placeholder="Johnathan Doe" required>
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 1.2rem; font-weight: 700; color: var(--primary-color); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 3px;">Secure Email</label>
                            <input type="email" placeholder="john@luxe.com" required>
                        </div>
                    </div>
                    <div style="margin-bottom: 4rem;">
                        <label style="display: block; margin-bottom: 1.2rem; font-weight: 700; color: var(--primary-color); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 3px;">The Inquiry</label>
                        <textarea placeholder="How may we assist in your culinary journey?" style="height: 220px;" required></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%; padding: 25px; font-size: 1.1rem; border-radius: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; background: var(--gradient-main); color: #000; box-shadow: 0 20px 40px rgba(255, 140, 66, 0.3);">
                        Transmit Message <i class="fas fa-paper-plane" style="margin-left: 15px;"></i>
                    </button>
                </form>
            </div>
        </div>

    </main>

    <div id="footerContainer"></div>
    <div id="toastContainer"></div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('contactForm').addEventListener('submit', (e) => {
                e.preventDefault();
                showToast('Protocol received. Our concierge will reach out shortly.', 'success');
                e.target.reset();
            });
        });
    </script>
</body>
</html>
