<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Custom App</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f0f2f5;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header class="dash-header">
            <h1>My Custom App</h1>
            
            <div class="user-profile">
                <span id="userNameDisplay">User</span>
                <div class="user-avatar" id="userAvatar">U</div>
                <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </header>

        <div style="background: white; padding: 3rem; border-radius: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
            <i class="fas fa-check-circle" style="font-size: 4rem; color: #2ed573; margin-bottom: 1rem;"></i>
            <h2 style="font-size: 2rem; margin-bottom: 1rem;">You are securely logged in!</h2>
            <p style="color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto;">
                Welcome to your new custom application dashboard. The 1-time verification was successful. Next time you visit the index page, you will be redirected here automatically.
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
