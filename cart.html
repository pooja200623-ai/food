<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Crave</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body class="dashboard-body">

    <!-- Navbar -->
    <nav class="dash-nav"></nav>

    <main class="dashboard-container reveal" style="padding-top: 120px; max-width: 1200px; margin: 0 auto; padding-bottom: 80px;">
        <!-- Cart Header -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem;">
            <div>
                <h1 style="font-size: 2rem; font-weight: 800; color: var(--text-main); margin-bottom: 4px;">Your Cart 🛒</h1>
                <p style="color: var(--text-muted); font-size: 0.95rem;" id="cartItemCount">Loading items...</p>
            </div>
            <a href="menu.html" style="text-decoration: none; display: flex; align-items: center; gap: 8px; color: var(--primary-color); font-weight: 600; font-size: 0.95rem; border: 2px solid var(--primary-color); padding: 10px 20px; border-radius: 50px; transition: all 0.3s;" onmouseover="this.style.background='var(--primary-color)';this.style.color='white'" onmouseout="this.style.background='transparent';this.style.color='var(--primary-color)'">
                <i class="fas fa-plus"></i> Add More
            </a>
        </div>
        <div id="cartContent" style="display: grid; grid-template-columns: 1fr 370px; gap: 2rem; align-items: start;">
            <!-- Cart Items -->
            <div id="cartItemsList" style="display: flex; flex-direction: column; gap: 1rem;">
                <!-- Dynamically filled -->
            </div>

            <!-- Order Summary -->
            <div id="orderSummary" style="background: white; padding: 2.5rem; border-radius: 30px; box-shadow: var(--shadow-premium); height: fit-content; border: 1px solid rgba(0,0,0,0.02);">
                <h3 style="margin-bottom: 2rem; border-bottom: 2px solid #f8f9fa; padding-bottom: 1.2rem; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px;">Checkout Details</h3>
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem;">Delivery Address</label>
                    <textarea id="deliveryAddress" placeholder="Enter your full delivery address..." style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 12px; font-family: inherit; resize: none; height: 80px;"></textarea>
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label for="paymentMethod" style="display: block; margin-bottom: 0.6rem; font-weight: 600; font-size: 0.9rem;">Payment Method</label>
                    <div style="position: relative;">
                        <span style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--primary-color); font-size: 1rem; pointer-events: none;" id="paymentIcon">
                            <i class="fas fa-money-bill-wave"></i>
                        </span>
                        <select id="paymentMethod" onchange="updatePaymentIcon(this)" style="
                            width: 100%;
                            padding: 13px 42px 13px 42px;
                            border: 2px solid #eee;
                            border-radius: 12px;
                            font-family: inherit;
                            font-size: 0.95rem;
                            font-weight: 500;
                            color: var(--text-main);
                            background: #fff;
                            appearance: none;
                            -webkit-appearance: none;
                            cursor: pointer;
                            transition: border-color 0.3s, box-shadow 0.3s;
                            outline: none;
                        "
                        onfocus="this.style.borderColor='var(--primary-color)';this.style.boxShadow='0 0 0 3px rgba(232,67,67,0.12)'"
                        onblur="this.style.borderColor='#eee';this.style.boxShadow='none'">
                            <option value="cod">🏠 Cash on Delivery — Pay when you receive</option>
                            <option value="card">💳 Credit / Debit Card — All major cards supported</option>
                            <option value="upi">📱 UPI / Net Banking — Fast &amp; secure payment</option>
                            <option value="wallet">👛 Wallet — Use your Crave wallet balance</option>
                        </select>
                        <span style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #aaa; pointer-events: none;">
                            <i class="fas fa-chevron-down"></i>
                        </span>
                    </div>
                    <p id="paymentHint" style="margin-top: 6px; font-size: 0.82rem; color: var(--text-muted); display: flex; align-items: center; gap: 5px;">
                        <i class="fas fa-shield-alt" style="color: var(--primary-color);"></i>
                        100% secure &amp; encrypted payment
                    </p>
                </div>

                <div style="margin-bottom: 1.5rem; background: #f9f9f9; padding: 1.2rem; border-radius: 14px; border: 1px dashed #ddd;">
                    <label style="display: block; margin-bottom: 0.6rem; font-weight: 600; font-size: 0.9rem;">Have a Coupon?</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="couponCode" placeholder="Enter code (e.g. CRAVE50)" style="flex: 1; padding: 10px; border: 2px solid #eee; border-radius: 10px; font-family: inherit; text-transform: uppercase;">
                        <button onclick="applyCoupon()" style="background: #2d3436; color: white; border: none; padding: 0 15px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.3s;" onmouseover="this.style.background='black'" onmouseout="this.style.background='#2d3436'">Apply</button>
                    </div>
                    <div id="couponMessage" style="margin-top: 8px; font-size: 0.82rem; font-weight: 500; display: none;"></div>
                </div>

                <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                    <span>Subtotal</span>
                    <span id="subtotal">₹0</span>
                </div>
                <div id="discountRow" style="display: none; justify-content: space-between; margin-bottom: 1rem; color: #27ae60; font-weight: 500;">
                    <span id="discountLabel">Discount</span>
                    <span id="discountAmount">-₹0</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                    <span>Delivery Fee</span>
                    <span style="color: #27ae60; font-weight: 500;">FREE</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 1.5rem; border-top: 1px solid #eee; padding-top: 1rem; font-size: 1.25rem; font-weight: 700;">
                    <span>Total</span>
                    <span id="totalPrice">₹0</span>
                </div>
                <button id="placeOrderBtn" class="btn-primary" style="width: 100%; margin-top: 2rem; padding: 15px; font-size: 1.1rem;">
                    Place Order <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <div id="emptyCartMessage" style="display: none; background: white; padding: 4rem 2rem; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
            <i class="fas fa-shopping-basket" style="font-size: 5rem; color: #eee; margin-bottom: 1.5rem;"></i>
            <h2>Your Cart is Empty</h2>
            <p style="color: #666; margin-bottom: 2.5rem;">Looks like you haven't added anything to your cart yet.</p>
            <a href="index.html" class="btn-primary" style="text-decoration: none; padding: 12px 30px;">Browse Delicious Foods</a>
        </div>
    </main>

    <div id="toastContainer"></div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const session = JSON.parse(localStorage.getItem('user_session'));
            if (!session) { window.location.replace('signin.html'); return; }

            const cartItemsList = document.getElementById('cartItemsList');
            const cartContent = document.getElementById('cartContent');
            const emptyCartMessage = document.getElementById('emptyCartMessage');
            const subtotalEl = document.getElementById('subtotal');
            const totalEl = document.getElementById('totalPrice');
            const placeOrderBtn = document.getElementById('placeOrderBtn');

            window.renderCart = function() {
                const cart = getCart();
                if (cart.length === 0) {
                    cartContent.style.display = 'none';
                    emptyCartMessage.style.display = 'block';
                    return;
                }

                cartContent.style.display = 'grid';
                emptyCartMessage.style.display = 'none';

                let total = 0;
                const itemCount = cart.reduce((t, i) => t + i.quantity, 0);
                document.getElementById('cartItemCount').textContent = `${cart.length} item${cart.length > 1 ? 's' : ''} · ${itemCount} total`;

                cartItemsList.innerHTML = cart.map(item => {
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;
                    const escapedName = item.name.replace(/'/g, "\\'");
                    return `
                        <div class="cart-item-card" style="background: white; border-radius: 20px; padding: 1.2rem; display: flex; gap: 1.5rem; box-shadow: var(--shadow-soft); transition: 0.3s; border: 1px solid rgba(0,0,0,0.02);" onmouseover="this.style.transform='translateX(5px)'" onmouseout="this.style.transform='translateX(0)'">
                            <div class="cart-item-img-wrap" style="width: 110px; height: 110px; border-radius: 15px; overflow: hidden;">
                                <img src="${item.image_url}" alt="${item.name}" class="cart-item-img" style="width: 100%; height: 100%; object-fit: cover;">
                            </div>
                            <div class="cart-item-details">
                                <div class="cart-item-top">
                                    <div>
                                        <span class="cart-item-badge">${item.category}</span>
                                        <h3 class="cart-item-name">${item.name}</h3>
                                        <p class="cart-item-unit-price">₹${item.price} per item</p>
                                    </div>
                                    <button onclick="removeFromCart('${escapedName}')" class="cart-remove-btn" title="Remove item">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </div>
                                <div class="cart-item-bottom">
                                    <div class="cart-qty-stepper">
                                        <button onclick="updateQuantity('${escapedName}', -1)" class="qty-btn"><i class="fas fa-minus"></i></button>
                                        <span class="qty-val">${item.quantity}</span>
                                        <button onclick="updateQuantity('${escapedName}', 1)" class="qty-btn"><i class="fas fa-plus"></i></button>
                                    </div>
                                    <div class="cart-item-total">₹${itemTotal.toLocaleString('en-IN')}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                subtotalEl.textContent = `₹${total}`;
                totalEl.textContent = `₹${total}`;
            }

            // Payment icon updater for dropdown
            window.updatePaymentIcon = function(sel) {
                const iconMap = {
                    cod:    'fa-money-bill-wave',
                    card:   'fa-credit-card',
                    upi:    'fa-mobile-alt',
                    wallet: 'fa-wallet'
                };
                const hintMap = {
                    cod:    'You will pay cash when the order is delivered.',
                    card:   'Visa, MasterCard, RuPay & more supported.',
                    upi:    'GPay, PhonePe, Paytm & all UPI apps accepted.',
                    wallet: 'Instant deduction from your Crave wallet.'
                };
                const iconEl = document.getElementById('paymentIcon');
                const hintEl = document.getElementById('paymentHint');
                const val = sel.value;
                if(iconEl) iconEl.innerHTML = `<i class="fas ${iconMap[val]}"></i>`;
                if(hintEl) hintEl.innerHTML = `<i class="fas fa-shield-alt" style="color:var(--primary-color);"></i> ${hintMap[val]}`;
            };

            let currentDiscount = 0;
            window.applyCoupon = function() {
                const code = document.getElementById('couponCode').value.trim().toUpperCase();
                const msg = document.getElementById('couponMessage');
                const discRow = document.getElementById('discountRow');
                const discAmt = document.getElementById('discountAmount');
                const discLbl = document.getElementById('discountLabel');
                const cart = getCart();
                const subtotal = cart.reduce((t, i) => t + (i.price * i.quantity), 0);

                if (!code) {
                    showToast('Please enter a coupon code', 'error');
                    return;
                }

                let discount = 0;
                let valid = false;
                let message = '';

                if (code === 'CRAVE50') {
                    discount = Math.min(subtotal * 0.5, 200);
                    message = `🎉 CRAVE50 applied! ₹${discount} saved.`;
                    valid = true;
                } else if (code === 'LOYAL20') {
                    discount = subtotal * 0.2;
                    message = `✨ LOYAL20 applied! 20% off.`;
                    valid = true;
                } else if (code === 'NEWUSER30') {
                    discount = subtotal * 0.3;
                    message = `👋 Welcome! 30% discount applied.`;
                    valid = true;
                } else if (code === 'PIZZAPARTY') {
                    discount = subtotal * 0.25;
                    message = `🍕 Pizza Party! 25% off applied.`;
                    valid = true;
                } else {
                    message = '❌ Invalid or expired coupon code.';
                    valid = false;
                }

                if (valid) {
                    currentDiscount = discount;
                    msg.style.color = '#27ae60';
                    msg.textContent = message;
                    msg.style.display = 'block';
                    discRow.style.display = 'flex';
                    discAmt.textContent = `-₹${Math.round(discount)}`;
                    discLbl.textContent = `Discount (${code})`;
                    totalEl.textContent = `₹${Math.round(subtotal - discount)}`;
                    showToast('Coupon applied successfully!', 'success');
                } else {
                    currentDiscount = 0;
                    msg.style.color = '#e84393';
                    msg.textContent = message;
                    msg.style.display = 'block';
                    discRow.style.display = 'none';
                    totalEl.textContent = `₹${subtotal}`;
                    showToast('Invalid coupon code', 'error');
                }
            };

            renderCart();

            placeOrderBtn.addEventListener('click', async () => {
                const cart = getCart();
                const address = document.getElementById('deliveryAddress').value.trim();
                const payment = document.getElementById('paymentMethod').value;

                if (cart.length === 0) return;
                
                if (!address) {
                    showToast('Please enter a delivery address', 'error');
                    document.getElementById('deliveryAddress').focus();
                    return;
                }

                placeOrderBtn.disabled = true;
                placeOrderBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

                try {
                    const response = await fetch('api/orders.php?action=place_order', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: session.email,
                            cart: cart,
                            address: address,
                            payment_method: payment,
                            coupon_code: document.getElementById('couponCode').value.trim() || null,
                            discount_amount: currentDiscount,
                            total_price: Math.round(cart.reduce((t, i) => t + (i.price * i.quantity), 0) - currentDiscount)
                        })
                    });

                    const data = await response.json();
                    if (data.success) {
                        showToast('Order placed successfully!', 'success');
                        localStorage.removeItem('cart');
                        setTimeout(() => {
                            window.location.href = 'orders.html';
                        }, 1500);
                    } else {
                        showToast(data.message || 'Failed to place order', 'error');
                        placeOrderBtn.disabled = false;
                        placeOrderBtn.innerHTML = 'Place Order <i class="fas fa-arrow-right"></i>';
                    }
                } catch (error) {
                    showToast('Connection error. Please try again.', 'error');
                    placeOrderBtn.disabled = false;
                    placeOrderBtn.innerHTML = 'Place Order <i class="fas fa-arrow-right"></i>';
                }
            });
        });
    </script>
</body>
</html>
