<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxe Cart | Your Curated Selection</title>
    <!-- Fonts via style.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=15">
    <style>
        .cart-item-card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-lg);
            padding: 2rem;
            display: flex;
            gap: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.4s;
        }
        .cart-item-card:hover {
            background: rgba(255, 255, 255, 0.04);
            transform: translateX(10px);
            border-color: rgba(124, 58, 237, 0.2);
        }
        .order-summary-box {
            background: #161618;
            padding: 3.5rem;
            border-radius: var(--radius-xl);
            box-shadow: 0 40px 80px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 120px;
        }
        .qty-btn {
            width: 35px;
            height: 35px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .qty-btn:hover {
            background: var(--primary-color);
            color: #000;
        }
        input, textarea, select {
            background: rgba(255,255,255,0.03) !important;
            border: 1px solid rgba(255,255,255,0.08) !important;
            color: white !important;
            outline: none;
        }
        input:focus, textarea:focus, select:focus {
            border-color: var(--primary-color) !important;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.1) !important;
        }
    </style>
</head>
<body class="dashboard-body">

    <!-- Navbar -->
    <nav class="dash-nav"></nav>

    <main class="dashboard-container reveal" style="padding-top: 15rem; padding-bottom: 12rem;">
        <!-- Cart Header -->
        <header style="margin-bottom: 6rem; text-align: left;">
            <div style="background: rgba(124, 58, 237, 0.1); color: var(--primary-color); padding: 10px 25px; border-radius: 50px; display: inline-block; font-weight: 900; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 2rem; border: 1px solid rgba(124, 58, 237, 0.2);">
                🛒 Your Curated Selection
            </div>
            <div style="display: flex; align-items: flex-end; justify-content: space-between;">
                <div>
                    <h1 style="font-size: 5rem; font-weight: 400; color: white; margin-bottom: 1rem; font-family: 'DM Serif Display', serif; letter-spacing: -2px;">The Collection</h1>
                    <p style="color: var(--text-muted); font-size: 1.2rem; font-weight: 300;" id="cartItemCount">Reviewing your gourmet choices...</p>
                </div>
                <a href="menu.html" style="text-decoration: none; display: flex; align-items: center; gap: 12px; color: var(--accent-color); font-weight: 800; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; border: 1px solid var(--accent-color); padding: 15px 35px; border-radius: 50px; transition: 0.4s;" onmouseover="this.style.background='var(--accent-color)';this.style.color='black';this.style.boxShadow='0 10px 20px rgba(16, 185, 129, 0.2)'" onmouseout="this.style.background='transparent';this.style.color='var(--accent-color)';this.style.boxShadow='none'">
                    <i class="fas fa-plus"></i> Add Masterpiece
                </a>
            </div>
        </header>

        <div id="cartContent" style="display: grid; grid-template-columns: 1fr 450px; gap: 5rem; align-items: start;">
            <!-- Cart Items -->
            <div id="cartItemsList" style="display: flex; flex-direction: column; gap: 2rem;">
                <!-- Dynamically filled -->
            </div>

            <!-- Order Summary -->
            <div class="order-summary-box">
                <h3 style="margin-bottom: 3.5rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 1.5rem; font-size: 2rem; font-weight: 400; font-family: 'DM Serif Display', serif; letter-spacing: -1px;">Protocol Details</h3>
                
                <div style="margin-bottom: 2.5rem;">
                    <label style="display: block; margin-bottom: 1.2rem; font-weight: 700; font-size: 0.8rem; color: var(--primary-color); text-transform: uppercase; letter-spacing: 2px;">The Delivery Sanctuary</label>
                    <textarea id="deliveryAddress" placeholder="Enter your full sanctuary address..." style="width: 100%; padding: 18px; border-radius: 15px; font-family: inherit; resize: none; height: 100px; font-size: 1.05rem;"></textarea>
                </div>

                <div style="margin-bottom: 2.5rem;">
                    <label style="display: block; margin-bottom: 1.2rem; font-weight: 700; font-size: 0.8rem; color: var(--primary-color); text-transform: uppercase; letter-spacing: 2px;">Payment Protocol</label>
                    <div style="position: relative;">
                        <span style="position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--accent-color); font-size: 1.1rem; pointer-events: none;" id="paymentIcon">
                            <i class="fas fa-money-bill-wave"></i>
                        </span>
                        <select id="paymentMethod" onchange="updatePaymentIcon(this)" style="
                            width: 100%;
                            padding: 15px 50px;
                            border-radius: 15px;
                            font-family: inherit;
                            font-size: 1rem;
                            font-weight: 600;
                            appearance: none;
                            cursor: pointer;
                        ">
                            <option value="cod">🏠 Cash on Delivery</option>
                            <option value="card">💳 Elite Credit / Debit</option>
                            <option value="upi">📱 Secure UPI</option>
                            <option value="wallet">👛 Luxe Wallet Balance</option>
                        </select>
                        <span style="position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.3); pointer-events: none;">
                            <i class="fas fa-chevron-down"></i>
                        </span>
                    </div>
                </div>

                <div style="margin-bottom: 3rem; background: rgba(255,255,255,0.02); padding: 2rem; border-radius: 20px; border: 1px dashed rgba(255,255,255,0.1);">
                    <label style="display: block; margin-bottom: 1.2rem; font-weight: 700; font-size: 0.8rem; color: var(--primary-color); text-transform: uppercase; letter-spacing: 2px;">Privilege Code</label>
                    <div style="display: flex; gap: 12px;">
                        <input type="text" id="couponCode" placeholder="Enter code..." style="flex: 1; padding: 12px 20px; border-radius: 12px; font-family: inherit; text-transform: uppercase; font-weight: 700; letter-spacing: 2px;">
                        <button onclick="applyCoupon()" style="background: var(--accent-color); color: #000; border: none; padding: 0 25px; border-radius: 12px; font-weight: 900; cursor: pointer; transition: 0.4s; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">Apply</button>
                    </div>
                    <div id="couponMessage" style="margin-top: 12px; font-size: 0.85rem; font-weight: 600; display: none;"></div>
                </div>

                <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; font-size: 1.1rem; opacity: 0.6;">
                    <span>Selection Subtotal</span>
                    <span id="subtotal">₹0</span>
                </div>
                <div id="discountRow" style="display: none; justify-content: space-between; margin-bottom: 1.5rem; color: var(--accent-color); font-weight: 700;">
                    <span id="discountLabel">Privilege Discount</span>
                    <span id="discountAmount">-₹0</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; opacity: 0.6;">
                    <span>Priority Delivery</span>
                    <span style="color: var(--accent-color); font-weight: 700;">COMPLIMENTARY</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 2rem; font-size: 1.8rem; font-family: 'DM Serif Display', serif;">
                    <span>Total</span>
                    <span id="totalPrice" style="color: var(--accent-color); font-size: 2.5rem;">₹0</span>
                </div>
                <button id="placeOrderBtn" class="btn-primary" style="width: 100%; margin-top: 4rem; padding: 25px; border-radius: 25px; font-size: 1.2rem; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; background: var(--gradient-main); color: #000; box-shadow: 0 20px 40px rgba(124, 58, 237, 0.4);">
                    Confirm Order <i class="fas fa-arrow-right" style="margin-left: 15px;"></i>
                </button>
            </div>
        </div>

        <div id="emptyCartMessage" style="display: none; background: rgba(255,255,255,0.02); padding: 10rem 4rem; border-radius: var(--radius-xl); text-align: center; border: 1px solid rgba(255,255,255,0.05);">
            <i class="fas fa-shopping-basket" style="font-size: 6rem; color: rgba(255,255,255,0.05); margin-bottom: 3rem;"></i>
            <h2 style="font-family: 'DM Serif Display', serif; font-size: 3.5rem; margin-bottom: 1.5rem;">The Vault is Empty</h2>
            <p style="color: var(--text-muted); margin-bottom: 4.5rem; font-size: 1.4rem; font-weight: 300;">Your collection awaits its first masterpiece.</p>
            <a href="menu.html" class="btn-primary" style="text-decoration: none; padding: 20px 50px; border-radius: 25px; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; background: var(--gradient-main); color: #000;">Discover Menu</a>
        </div>
    </main>

    <div id="footerContainer"></div>
    <div id="toastContainer"></div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const session = JSON.parse(localStorage.getItem('user_session'));
            if (!session) { window.location.replace('signin.html'); return; }

            const cartItemsList = document.getElementById('cartItemsList');
            const cartContent = document.getElementById('cartContent');
            const emptyCartMessage = document.getElementById('emptyCartMessage');
            const subtotalEl = document.getElementById('subtotal');
            const totalEl = document.getElementById('totalPrice');
            const placeOrderBtn = document.getElementById('placeOrderBtn');

            window.renderCart = function() {
                const cart = getCart();
                if (cart.length === 0) {
                    cartContent.style.display = 'none';
                    emptyCartMessage.style.display = 'block';
                    return;
                }

                cartContent.style.display = 'grid';
                emptyCartMessage.style.display = 'none';

                let total = 0;
                const itemCount = cart.reduce((t, i) => t + i.quantity, 0);
                document.getElementById('cartItemCount').textContent = `${cart.length} Masterpiece${cart.length > 1 ? 's' : ''} · ${itemCount} Varieties`;

                cartItemsList.innerHTML = cart.map(item => {
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;
                    const escapedName = item.name.replace(/'/g, "\\'");
                    return `
                        <div class="cart-item-card reveal">
                            <div style="width: 180px; height: 180px; border-radius: 20px; overflow: hidden; flex-shrink: 0;">
                                <img src="${item.image_url}" alt="${item.name}" style="width: 100%; height: 100%; object-fit: cover;">
                            </div>
                            <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                    <div>
                                        <span style="font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 3px; color: var(--accent-color); margin-bottom: 8px; display: block;">${item.category}</span>
                                        <h3 style="font-family: 'DM Serif Display', serif; font-size: 2.5rem; margin-bottom: 10px;">${item.name}</h3>
                                        <p style="color: var(--text-muted); font-size: 1.1rem; font-weight: 400;">₹${item.price} per selection</p>
                                    </div>
                                    <button onclick="removeFromCart('${escapedName}')" style="background: rgba(255,71,87,0.1); border: none; color: #ff4757; width: 45px; height: 45px; border-radius: 12px; cursor: pointer; transition: 0.3s;" onmouseover="this.style.background='#ff4757';this.style.color='white'">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                                    <div style="display: flex; align-items: center; background: rgba(255,255,255,0.03); padding: 8px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); gap: 20px;">
                                        <button onclick="updateQuantity('${escapedName}', -1)" class="qty-btn"><i class="fas fa-minus"></i></button>
                                        <span style="font-weight: 900; font-size: 1.2rem; min-width: 25px; text-align: center;">${item.quantity}</span>
                                        <button onclick="updateQuantity('${escapedName}', 1)" class="qty-btn"><i class="fas fa-plus"></i></button>
                                    </div>
                                    <div style="font-family: 'DM Serif Display', serif; font-size: 2.2rem; color: white;">₹${itemTotal.toLocaleString('en-IN')}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                subtotalEl.textContent = `₹${total}`;
                totalEl.textContent = `₹${total}`;
            }

            window.updatePaymentIcon = function(sel) {
                const iconMap = { cod: 'fa-money-bill-wave', card: 'fa-credit-card', upi: 'fa-mobile-alt', wallet: 'fa-wallet' };
                const iconEl = document.getElementById('paymentIcon');
                const val = sel.value;
                if(iconEl) iconEl.innerHTML = `<i class="fas ${iconMap[val]}"></i>`;
            };

            let currentDiscount = 0;
            window.applyCoupon = function() {
                const code = document.getElementById('couponCode').value.trim().toUpperCase();
                const msg = document.getElementById('couponMessage');
                const discRow = document.getElementById('discountRow');
                const discAmt = document.getElementById('discountAmount');
                const discLbl = document.getElementById('discountLabel');
                const cart = getCart();
                const subtotal = cart.reduce((t, i) => t + (i.price * i.quantity), 0);

                if (!code) { showToast('Protocol Code required', 'error'); return; }

                let discount = 0;
                let valid = false;
                let message = '';

                if (code === 'CRAVE50') { discount = Math.min(subtotal * 0.5, 200); message = `✨ Code CRAVE50 Valid: ₹${discount} Privilege Applied.`; valid = true; }
                else if (code === 'LUXE20') { discount = subtotal * 0.2; message = `✨ Code LUXE20 Valid: 20% Privilege Applied.`; valid = true; }
                else { message = '❌ Invalid Protocol Code.'; valid = false; }

                if (valid) {
                    currentDiscount = discount;
                    msg.style.color = 'var(--accent-color)';
                    msg.textContent = message;
                    msg.style.display = 'block';
                    discRow.style.display = 'flex';
                    discAmt.textContent = `-₹${Math.round(discount)}`;
                    discLbl.textContent = `Privilege (${code})`;
                    totalEl.textContent = `₹${Math.round(subtotal - discount)}`;
                    showToast('Privilege applied', 'success');
                } else {
                    currentDiscount = 0;
                    msg.style.color = '#ff4757';
                    msg.textContent = message;
                    msg.style.display = 'block';
                    discRow.style.display = 'none';
                    totalEl.textContent = `₹${subtotal}`;
                    showToast('Invalid code', 'error');
                }
            };

            renderCart();

            placeOrderBtn.addEventListener('click', async () => {
                const cart = getCart();
                const address = document.getElementById('deliveryAddress').value.trim();
                const payment = document.getElementById('paymentMethod').value;

                if (cart.length === 0) {
                    showToast('Your cart is empty!', 'error');
                    return;
                }
                if (!address) {
                    showToast('Please enter your delivery address', 'error');
                    document.getElementById('deliveryAddress').focus();
                    return;
                }

                placeOrderBtn.disabled = true;
                placeOrderBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Placing Order...';

                const totalPrice = Math.round(
                    cart.reduce((t, i) => t + (i.price * i.quantity), 0) - currentDiscount
                );

                const payload = {
                    email:          session.email,
                    cart:           cart,
                    address:        address,
                    payment_method: payment,
                    total_price:    totalPrice
                };

                try {
                    const response = await fetch('api/orders.php?action=place_order', {
                        method:  'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body:    JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`Server error: ${response.status}`);
                    }

                    const data = await response.json();

                    if (data.success) {
                        // Clear cart first
                        localStorage.removeItem('cart');
                        saveCart([]);  // update count in navbar

                        // Show success state on button
                        placeOrderBtn.innerHTML = '<i class="fas fa-check-circle"></i> Order Placed!';
                        placeOrderBtn.style.background = 'linear-gradient(135deg, #2ed573, #17a850)';

                        showToast('🎉 Order placed successfully!', 'success');

                        // Redirect to orders page
                        setTimeout(() => {
                            window.location.href = 'orders.html';
                        }, 1800);

                    } else {
                        showToast(data.message || 'Failed to place order. Try again.', 'error');
                        placeOrderBtn.disabled = false;
                        placeOrderBtn.innerHTML = 'Confirm Order <i class="fas fa-arrow-right" style="margin-left: 15px;"></i>';
                    }

                } catch (error) {
                    console.error('Order placement error:', error);
                    showToast('Connection failed. Is XAMPP running?', 'error');
                    placeOrderBtn.disabled = false;
                    placeOrderBtn.innerHTML = 'Confirm Order <i class="fas fa-arrow-right" style="margin-left: 15px;"></i>';
                }
            });
        });
    </script>
</body>
</html>
