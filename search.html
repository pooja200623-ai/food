<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Restaurants | Zomato</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background:#f2f2f2;">

<header class="inner-header">
    <div class="container inner-nav">
        <a href="index.html" class="logo-link">zomato</a>
        <div class="spacer"></div>
        <div class="nav-actions">
            <a href="dashboard.html"><i class="fas fa-home"></i> Home</a>
            <span id="navUser" style="color:var(--text-muted); font-size:0.95rem;"></span>
            <button class="logout-btn" id="logoutBtn" style="display:none;" onclick="logout()">Logout</button>
        </div>
    </div>
</header>

<div class="search-hero">
    <div class="container">
        <div class="search-big-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search for restaurant, cuisine or a dish..." autofocus>
        </div>
    </div>
</div>

<div class="inner-page container">
    <div class="search-layout">
        <!-- Filters -->
        <aside class="filter-sidebar">
            <h3>Filters</h3>
            <div class="filter-group">
                <h4>Sort By</h4>
                <label class="custom-radio"><input type="radio" name="sort" value="rating" checked><span>Relevance</span></label>
                <label class="custom-radio"><input type="radio" name="sort" value="rating"><span>Rating: High to Low</span></label>
                <label class="custom-radio"><input type="radio" name="sort" value="delivery"><span>Delivery Time</span></label>
            </div>
            <div class="filter-group">
                <h4>Cuisines</h4>
                <label class="custom-checkbox"><input type="checkbox" class="cuisine-filter" value="Pizza"><span>Pizza</span></label>
                <label class="custom-checkbox"><input type="checkbox" class="cuisine-filter" value="Burger"><span>Burger</span></label>
                <label class="custom-checkbox"><input type="checkbox" class="cuisine-filter" value="Sushi"><span>Sushi</span></label>
                <label class="custom-checkbox"><input type="checkbox" class="cuisine-filter" value="Indian"><span>Indian</span></label>
                <label class="custom-checkbox"><input type="checkbox" class="cuisine-filter" value="Mexican"><span>Mexican</span></label>
            </div>
            <div class="filter-group">
                <h4>Price Range</h4>
                <div class="price-pills">
                    <button class="price-pill">$</button>
                    <button class="price-pill active">$$</button>
                    <button class="price-pill">$$$</button>
                </div>
            </div>
        </aside>

        <!-- Results -->
        <div class="results-area">
            <div class="results-header">
                <h2 id="resultsTitle">Loading restaurants...</h2>
            </div>
            <div id="resultsGrid" class="restaurant-grid"></div>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const query = params.get('q') || '';
    const input = document.getElementById('searchInput');
    if (query) input.value = query;

    const user = JSON.parse(localStorage.getItem('currentUser'));
    if (user) {
        document.getElementById('navUser').textContent = user.name;
        document.getElementById('logoutBtn').style.display = 'block';
    }

    function renderRestaurants(list) {
        const grid = document.getElementById('resultsGrid');
        const title = document.getElementById('resultsTitle');
        if (!list.length) {
            title.textContent = 'No restaurants found';
            grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--text-muted);">Try a different search term.</div>';
            return;
        }
        title.textContent = `Found ${list.length} restaurant${list.length > 1 ? 's' : ''}` + (query ? ` for "${input.value}"` : '');
        grid.innerHTML = list.map(r => `
            <div class="res-card" onclick="window.location.href='restaurant.html?id=${r.id}'">
                <div class="res-image-container">
                    <img src="${r.image_url}" alt="${r.name}">
                    <span class="res-discount">50% OFF up to ₹100</span>
                    <span class="res-time">${r.delivery_time}</span>
                </div>
                <div class="res-info-row">
                    <h4 class="res-name">${r.name}</h4>
                    <span class="res-rating">${r.rating} <i class="fas fa-star" style="font-size:0.7rem"></i></span>
                </div>
                <div class="res-meta-row">
                    <span class="res-cuisines">${r.category}</span>
                    <span>₹200 for one</span>
                </div>
            </div>`).join('');
    }

    fetch('api/restaurants.php?action=all')
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                let list = data.data;
                if (query) list = list.filter(r => r.name.toLowerCase().includes(query.toLowerCase()) || r.category.toLowerCase().includes(query.toLowerCase()));
                renderRestaurants(list);

                input.addEventListener('input', () => {
                    const q = input.value.toLowerCase();
                    renderRestaurants(q ? list.filter(r => r.name.toLowerCase().includes(q) || r.category.toLowerCase().includes(q)) : list);
                });
            }
        })
        .catch(() => { document.getElementById('resultsTitle').textContent = 'Could not load restaurants'; });
});
function logout() {
    localStorage.removeItem('currentUser');
    window.location.href = 'index.html';
}
</script>
</body>
</html>
