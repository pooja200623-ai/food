<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Menu | 80+ Varieties</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=10">
    <style>
        .menu-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 3rem;
            margin-top: 2rem;
        }
        .menu-sidebar {
            position: sticky;
            top: 100px;
            height: calc(100vh - 150px);
            background: white;
            padding: 2rem;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            border-radius: 12px;
            transition: 0.3s;
            margin-bottom: 5px;
        }
        .sidebar-link:hover, .sidebar-link.active {
            background: rgba(255, 71, 87, 0.1);
            color: var(--primary-color);
        }
        .category-section {
            margin-bottom: 5rem;
            scroll-margin-top: 100px;
        }
        .category-title {
            font-size: 2.2rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #eee;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        @media (max-width: 992px) {
            .menu-layout { grid-template-columns: 1fr; }
            .menu-sidebar { display: none; }
        }
    </style>
</head>
<body class="dashboard-body">

    <!-- Navbar -->
    <nav class="dash-nav">
        <!-- (Same navbar as index for consistency) -->
        <div class="nav-brand"><i class="fas fa-utensils"></i> Crave</div>
        <div class="nav-links" style="display: flex; gap: 20px; align-items: center;">
            <a href="index.html" style="text-decoration: none; color: var(--text-main);">Home</a>
            <a href="menu.html" style="text-decoration: none; color: var(--primary-color); border-bottom: 2px solid var(--primary-color);">Our Menu</a>
            <a href="offers.html" style="text-decoration: none; color: var(--text-main);">Offers</a>
            <a href="cart.html" style="text-decoration: none; color: var(--text-main);">Cart</a>
            <a href="orders.html" style="text-decoration: none; color: var(--text-main);">Orders</a>
            <a href="profile.html" style="text-decoration: none; color: var(--text-main);">Profile</a>
        </div>
        <div class="user-profile">
            <span id="userNameDisplay">User</span>
            <div class="user-avatar" id="userAvatar">U</div>
        </div>
    </nav>

    <main class="dashboard-container">
        <header style="text-align: center; margin-bottom: 4rem;">
            <h1 style="font-size: 3rem; margin-bottom: 1rem;">Explore Our <span style="color: var(--primary-color);">Delicacies</span></h1>
            <p style="color: #666; font-size: 1.2rem;">Choose from 80+ handcrafted dishes across 8 global varieties.</p>
        </header>

        <div class="menu-layout">
            <!-- Sticky Sidebar -->
            <aside class="menu-sidebar">
                <h3 style="margin-bottom: 1.5rem; color: #888; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">Varieties</h3>
                <a href="#Indian" class="sidebar-link active"><i class="fas fa-pepper-hot"></i> Indian</a>
                <a href="#Chinese" class="sidebar-link"><i class="fas fa-bowl-food"></i> Chinese</a>
                <a href="#Korean" class="sidebar-link"><i class="fas fa-fire"></i> Korean</a>
                <a href="#Japanese" class="sidebar-link"><i class="fas fa-fish"></i> Japanese</a>
                <a href="#American" class="sidebar-link"><i class="fas fa-hamburger"></i> American</a>
                <a href="#Fast Food" class="sidebar-link"><i class="fas fa-pizza-slice"></i> Fast Food</a>
                <a href="#Healthy" class="sidebar-link"><i class="fas fa-leaf"></i> Healthy</a>
                <a href="#Desserts" class="sidebar-link"><i class="fas fa-ice-cream"></i> Desserts</a>
            </aside>

            <!-- Menu Content -->
            <div class="menu-content">
                <div id="menuContainer">
                    <!-- Categories will be injected here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Modal and script logic -->
    <div id="quickOrderModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; backdrop-filter: blur(5px); align-items: center; justify-content: center;">
        <div style="background: white; width: 90%; max-width: 450px; padding: 2.5rem; border-radius: 25px; position: relative;">
            <button onclick="closeQuickOrder()" style="position: absolute; top: 20px; right: 20px; border: none; background: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
            <h2 id="modalFoodName">Food Name</h2>
            <p id="modalFoodPrice" style="color: var(--primary-color); font-size: 1.5rem; font-weight: 800; margin: 1rem 0;">₹0</p>
            <textarea id="quickAddress" placeholder="Delivery Address" style="width: 100%; padding: 15px; border-radius: 15px; border: 2px solid #eee; margin-bottom: 1.5rem; height: 80px;"></textarea>
            <button id="confirmOrderBtn" class="btn-primary" style="width: 100%; padding: 15px;">Place Instant Order</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const session = JSON.parse(localStorage.getItem('user_session'));
            const menuContainer = document.getElementById('menuContainer');
            const categories = ['Indian', 'Chinese', 'Korean', 'Japanese', 'American', 'Fast Food', 'Healthy', 'Desserts'];

            async function loadFullMenu() {
                menuContainer.innerHTML = '';
                for (const cat of categories) {
                    const res = await fetch(`api/foods.php?action=category&category=${encodeURIComponent(cat)}`);
                    const data = await res.json();
                    
                    if (data.success) {
                        const section = document.createElement('div');
                        section.id = cat;
                        section.className = 'category-section';
                        
                        section.innerHTML = `
                            <h2 class="category-title">${cat} <small style="font-size: 0.9rem; color: #888; font-weight: 400;">(${data.data.length} varieties)</small></h2>
                            <div class="food-grid">
                                ${data.data.map((food, i) => `
                                    <div class="food-card">
                                        <div class="food-image"><img src="${food.image_url}"></div>
                                        <div class="food-info">
                                            <div class="food-header">
                                                <h3>${food.name}</h3>
                                                <span class="food-rating">${food.rating} ★</span>
                                            </div>
                                            <p class="food-desc">${food.description}</p>
                                            <div class="food-footer">
                                                <span class="food-price">₹${food.price}</span>
                                                <button class="btn-primary" onclick='openQuickOrder(${JSON.stringify(food).replace(/'/g, "&apos;")})'>Order</button>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                        menuContainer.appendChild(section);
                    }
                }
            }

            loadFullMenu();

            // Modal logic
            let selectedFood = null;
            window.openQuickOrder = (food) => {
                selectedFood = food;
                document.getElementById('modalFoodName').textContent = food.name;
                document.getElementById('modalFoodPrice').textContent = `₹${food.price}`;
                document.getElementById('quickOrderModal').style.display = 'flex';
            };

            window.closeQuickOrder = () => {
                document.getElementById('quickOrderModal').style.display = 'none';
            };

            document.getElementById('confirmOrderBtn').addEventListener('click', async () => {
                const address = document.getElementById('quickAddress').value;
                if(!address) return showToast('Please enter address', 'error');
                
                const res = await fetch('api/orders.php?action=place_order', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: session.email,
                        cart: [{...selectedFood, quantity: 1}],
                        address: address,
                        payment_method: 'cod',
                        total_price: selectedFood.price
                    })
                });
                const data = await res.json();
                if(data.success) {
                    showToast('Order placed!', 'success');
                    closeQuickOrder();
                }
            });

            // Scroll spy for sidebar
            window.addEventListener('scroll', () => {
                let current = "";
                categories.forEach(cat => {
                    const section = document.getElementById(cat);
                    if (section && window.pageYOffset >= section.offsetTop - 150) {
                        current = cat;
                    }
                });

                document.querySelectorAll('.sidebar-link').forEach(link => {
                    link.classList.remove('active');
                    if (link.getAttribute('href') === `#${current}`) {
                        link.classList.add('active');
                    }
                });
            });
        });
    </script>
</body>
</html>
