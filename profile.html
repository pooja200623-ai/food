<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Zomato</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background:#f2f2f2;">

<header class="inner-header">
    <div class="container inner-nav">
        <button class="back-btn" onclick="window.history.back()"><i class="fas fa-chevron-left"></i></button>
        <a href="index.html" class="logo-link">zomato</a>
        <span class="page-title" style="margin-left:8px;">My Account</span>
        <div class="spacer"></div>
        <div class="nav-actions">
            <a href="dashboard.html"><i class="fas fa-home"></i></a>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>
</header>

<div class="inner-page container">
    <div class="profile-layout">
        <!-- Sidebar -->
        <aside class="profile-sidebar-card">
            <div class="profile-avatar-section">
                <img id="profileAvatar" src="https://ui-avatars.com/api/?name=User&background=fff&color=E23744" alt="Avatar">
                <h3 id="profileName">Loading...</h3>
                <p id="profileEmail">...</p>
            </div>
            <div class="profile-nav-list">
                <div class="profile-nav-item active" onclick="showTab('orders', this)"><i class="fas fa-receipt"></i> Order History</div>
                <div class="profile-nav-item" onclick="showTab('addresses', this)"><i class="fas fa-map-marker-alt"></i> Saved Addresses</div>
                <div class="profile-nav-item" onclick="window.location.href='settings.html'"><i class="fas fa-cog"></i> Account Settings</div>
                <div class="profile-nav-item" onclick="window.location.href='referral.html'"><i class="fas fa-gift"></i> Refer & Earn</div>
                <div class="profile-nav-item danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</div>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="profile-main-content">
            <!-- Orders Tab -->
            <div id="tab-orders">
                <div class="profile-card">
                    <h3>Recent Orders</h3>
                    <div id="ordersList">
                        <div style="text-align:center;padding:2rem;color:var(--text-muted);"><i class="fas fa-circle-notch fa-spin fa-2x"></i><p style="margin-top:12px;">Loading orders...</p></div>
                    </div>
                </div>
            </div>

            <!-- Addresses Tab -->
            <div id="tab-addresses" style="display:none;">
                <div class="profile-card">
                    <h3>Saved Addresses</h3>
                    <div class="address-card-item active">
                        <span class="addr-tag">Home</span>
                        <h4 id="addrName">Your Name</h4>
                        <p>123 Main Street, Downtown, New York - 10001</p>
                    </div>
                    <button class="add-address-btn"><i class="fas fa-plus"></i> Add New Address</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const user = JSON.parse(localStorage.getItem('currentUser'));
    if (!user) { window.location.href = 'index.html'; return; }

    document.getElementById('profileName').textContent = user.name;
    document.getElementById('profileEmail').textContent = user.email;
    document.getElementById('addrName').textContent = user.name;
    document.getElementById('profileAvatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=fff&color=E23744&bold=true`;

    // Load orders from API
    if (user.id) {
        fetch(`api/orders.php?action=history&user_id=${user.id}`)
            .then(r => r.json())
            .then(data => {
                const list = document.getElementById('ordersList');
                if (data.success && data.data.length > 0) {
                    list.innerHTML = data.data.map(o => `
                        <div class="order-history-item">
                            <div class="order-left">
                                <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=50&q=80" alt="order">
                                <div class="order-detail">
                                    <h4>Order #${o.id}</h4>
                                    <p>${new Date(o.created_at).toLocaleDateString()} &bull; ₹${o.total_amount}</p>
                                </div>
                            </div>
                            <div>
                                <span class="order-status-badge ${o.status === 'Processing' ? 'preparing' : 'delivered'}">${o.status}</span>
                                <br><button class="reorder-btn" onclick="window.location.href='dashboard.html'">Reorder</button>
                            </div>
                        </div>`).join('');
                } else {
                    list.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem;">No orders yet. <a href="dashboard.html" style="color:var(--primary-red);">Order now!</a></p>';
                }
            })
            .catch(() => {
                document.getElementById('ordersList').innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem;">No orders yet.</p>';
            });
    } else {
        document.getElementById('ordersList').innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem;">No orders yet. <a href="dashboard.html" style="color:var(--primary-red);">Order now!</a></p>';
    }
});

function showTab(tab, el) {
    document.querySelectorAll('.profile-nav-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('tab-orders').style.display = 'none';
    document.getElementById('tab-addresses').style.display = 'none';
    document.getElementById('tab-' + tab).style.display = 'block';
}

function logout() {
    localStorage.removeItem('currentUser');
    window.location.href = 'index.html';
}
</script>
</body>
</html>
