<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Crave</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body class="dashboard-body">

    <!-- Navbar -->
    <nav class="dash-nav">
        <div class="nav-brand">
            <i class="fas fa-utensils"></i> Crave
        </div>
        
        <div class="nav-links" style="display: flex; gap: 20px; align-items: center; font-weight: 500; font-size: 0.95rem;">
            <a href="index.html" style="text-decoration: none; color: var(--text-main); transition: 0.3s;" onmouseover="this.style.color='var(--primary-color)'" onmouseout="this.style.color='var(--text-main)'">Home</a>
            <a href="index.html#menu" style="text-decoration: none; color: var(--text-main); transition: 0.3s;" onmouseover="this.style.color='var(--primary-color)'" onmouseout="this.style.color='var(--text-main)'">Our Menu</a>
            <a href="#" style="text-decoration: none; color: var(--text-main); transition: 0.3s;" onmouseover="this.style.color='var(--primary-color)'" onmouseout="this.style.color='var(--text-main)'">Offers</a>
            <a href="cart.html" style="text-decoration: none; color: var(--text-main); transition: 0.3s; position: relative;" onmouseover="this.style.color='var(--primary-color)'" onmouseout="this.style.color='var(--text-main)'">
                Cart <i class="fas fa-shopping-cart"></i>
                <span id="cartCount" style="position: absolute; top: -10px; right: -15px; background: var(--primary-color); color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.75rem; font-weight: bold;">0</span>
            </a>
            <a href="orders.html" style="text-decoration: none; color: var(--text-main); transition: 0.3s;" onmouseover="this.style.color='var(--primary-color)'" onmouseout="this.style.color='var(--text-main)'">Orders</a>
            <a href="profile.html" style="text-decoration: none; color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 5px;">Profile</a>
            <a href="about.html" style="text-decoration: none; color: var(--text-main); transition: 0.3s;" onmouseover="this.style.color='var(--primary-color)'" onmouseout="this.style.color='var(--text-main)'">About</a>
            <a href="contact.html" style="text-decoration: none; color: var(--text-main); transition: 0.3s;" onmouseover="this.style.color='var(--primary-color)'" onmouseout="this.style.color='var(--text-main)'">Contact</a>
        </div>

        <div class="user-profile">
            <span id="userNameDisplay">User</span>
            <div class="user-avatar" id="userAvatar">U</div>
            <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </nav>

    <main class="dashboard-container" style="padding-top: 120px;">
        <div style="background: white; padding: 3rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 600px; margin: 0 auto; text-align: center;">
            <div class="user-avatar" id="profileBigAvatar" style="width: 100px; height: 100px; font-size: 3rem; margin: 0 auto 1.5rem;">U</div>
            <h2 id="profileName" style="margin-bottom: 0.5rem;">User Name</h2>
            <p id="profileEmail" style="color: #666; margin-bottom: 2rem;">user@example.com</p>
            
            <div style="display: flex; flex-direction: column; gap: 1rem; text-align: left;">
                <div style="padding: 1rem; border: 1px solid #eee; border-radius: 10px;">
                    <strong style="color: var(--primary-color);">Account Status</strong>
                    <p style="margin-top: 5px;">Active & Verified</p>
                </div>
                <div style="padding: 1rem; border: 1px solid #eee; border-radius: 10px;">
                    <strong style="color: var(--primary-color);">Delivery Address</strong>
                    <p style="margin-top: 5px;">No address saved yet. Add one during checkout.</p>
                </div>
            </div>
            
            <button id="logoutBtnProfile" class="btn-primary" style="margin-top: 2rem; width: 100%;">Log Out</button>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const session = JSON.parse(localStorage.getItem('user_session'));
            if (!session) {
                window.location.replace('signin.html');
                return;
            }
            
            // Setup names
            document.getElementById('userNameDisplay').textContent = session.name;
            document.getElementById('userAvatar').textContent = session.name.charAt(0).toUpperCase();
            
            document.getElementById('profileName').textContent = session.name;
            document.getElementById('profileEmail').textContent = session.email;
            document.getElementById('profileBigAvatar').textContent = session.name.charAt(0).toUpperCase();

            const logoutFn = () => {
                localStorage.removeItem('user_session');
                window.location.href = 'signin.html';
            };
            
            document.getElementById('logoutBtn').addEventListener('click', logoutFn);
            document.getElementById('logoutBtnProfile').addEventListener('click', logoutFn);

            // Sync cart count
            if (typeof saveCart === 'function') {
                saveCart(getCart());
            }
        });
    </script>
</body>
</html>
