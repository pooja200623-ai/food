<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crave | Discover Food Variety</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=10">
    <style>
        .category-showcase {
            margin-bottom: 5rem;
            animation: fadeUp 0.8s ease backwards;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 2rem;
            padding: 0 0.5rem;
        }
        .category-header h2 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .horizontal-scroll {
            display: flex;
            gap: 2.5rem;
            overflow-x: auto;
            padding: 1.5rem 0.5rem 3rem;
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .horizontal-scroll::-webkit-scrollbar {
            display: none;
        }
        .scroll-card {
            min-width: 320px;
            flex-shrink: 0;
        }
        .view-all-btn {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            padding: 10px 20px;
            border-radius: 50px;
            background: rgba(255, 71, 87, 0.05);
            font-size: 0.95rem;
        }
        .view-all-btn:hover {
            background: var(--primary-color);
            color: white;
            gap: 12px;
        }
        .hero-floating-badge {
            position: absolute;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 15px 25px;
            border-radius: 20px;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: float 4s ease-in-out infinite;
            z-index: 5;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }
    </style>
</head>
<body class="dashboard-body">

    <!-- Navbar -->
    <nav class="dash-nav"></nav>

    <!-- Hero Banner -->
    <header class="dash-hero reveal" style="height: 650px; background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1920&q=80') center/cover; position: relative;">
        <!-- Animated Blobs for Depth -->
        <div style="position: absolute; top: 10%; left: 5%; width: 300px; height: 300px; background: radial-gradient(circle, rgba(255, 71, 87, 0.2) 0%, transparent 70%); filter: blur(50px); animation: pulse-soft 6s infinite;"></div>
        <div style="position: absolute; bottom: 10%; right: 5%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(112, 161, 255, 0.15) 0%, transparent 70%); filter: blur(60px); animation: pulse-soft 8s infinite reverse;"></div>

        <div class="hero-floating-badge" style="top: 15%; left: 8%; animation: float 5s ease-in-out infinite;">
            <div style="width: 55px; height: 55px; background: #FFD700; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: #000; font-size: 1.4rem; box-shadow: 0 10px 25px rgba(255,215,0,0.4);">
                <i class="fas fa-crown"></i>
            </div>
            <div>
                <div style="font-size: 0.85rem; opacity: 0.8; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;">Elite Choice</div>
                <div style="font-size: 1.2rem; font-weight: 800;">5-Star Rated</div>
            </div>
        </div>

        <div class="hero-floating-badge" style="bottom: 20%; right: 10%; animation: float 4s ease-in-out infinite reverse;">
            <div style="width: 55px; height: 55px; background: #2ed573; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.4rem; box-shadow: 0 10px 25px rgba(46,213,115,0.4);">
                <i class="fas fa-bolt"></i>
            </div>
            <div>
                <div style="font-size: 0.85rem; opacity: 0.8; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;">Express</div>
                <div style="font-size: 1.2rem; font-weight: 800;">Instant Delivery</div>
            </div>
        </div>

        <div class="hero-content" style="max-width: 1100px; position: relative; z-index: 10; padding: 0 2rem;">
            <h1 style="font-size: 6.5rem; font-weight: 900; letter-spacing: -4px; line-height: 0.9; margin-bottom: 2.5rem; text-shadow: 0 20px 50px rgba(0,0,0,0.4);">
                Savor the <span style="background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Extraordinary</span>.<br>
                <span style="font-size: 4.5rem; opacity: 0.95; font-weight: 600; letter-spacing: -1px;">Redefining Culinary Art.</span>
            </h1>
            <p style="font-size: 1.8rem; margin-bottom: 4rem; opacity: 0.95; font-weight: 400; max-width: 800px; margin-left: auto; margin-right: auto; line-height: 1.6; text-shadow: 0 2px 10px rgba(0,0,0,0.2);">
                Experience the pinnacle of flavor. Over 80+ handcrafted delicacies, 
                curated by visionary chefs and delivered with absolute precision.
            </p>
            <div class="search-bar glass-card" style="width: 100%; max-width: 750px; margin: 0 auto; padding: 1.5rem 3rem; border-radius: 30px; box-shadow: var(--shadow-premium); border: 1px solid rgba(255,255,255,0.4);">
                <i class="fas fa-search" style="font-size: 1.6rem; color: var(--primary-color);"></i>
                <input type="text" id="searchInput" placeholder="Search for your next culinary obsession..." style="font-size: 1.3rem; font-weight: 500; color: var(--text-main);">
                <button class="btn-primary" style="width: auto; padding: 10px 25px; border-radius: 20px; font-size: 1rem;">Find Food</button>
            </div>
        </div>
    </header>

    <main class="dashboard-container" style="padding-top: 8rem;">
        
        <!-- Quick Variety Access -->
        <section class="reveal" style="margin-bottom: 8rem; animation-delay: 0.2s;">
            <div style="text-align: center; margin-bottom: 4rem;">
                <span style="background: rgba(255, 71, 87, 0.1); color: var(--primary-color); padding: 10px 25px; border-radius: 50px; font-weight: 800; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 3px; box-shadow: 0 5px 15px rgba(255,71,87,0.1);">
                    <i class="fas fa-fire-alt" style="margin-right: 8px;"></i> Trending Categories
                </span>
            </div>
            <div id="categoryPills" style="display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap;">
                <!-- Categories will be injected by JS to ensure clean HTML -->
                <button class="filter-pill active" onclick="location.href='menu.html'">All Menu</button>
                <button class="filter-pill" onclick="location.href='menu.html?category=Indian'">Indian</button>
                <button class="filter-pill" onclick="location.href='menu.html?category=Chinese'">Chinese</button>
                <button class="filter-pill" onclick="location.href='menu.html?category=American'">American</button>
                <button class="filter-pill" onclick="location.href='menu.html?category=Korean'">Korean</button>
                <button class="filter-pill" onclick="location.href='menu.html?category=Japanese'">Japanese</button>
                <button class="filter-pill" onclick="location.href='menu.html?category=Healthy'">Healthy</button>
                <button class="filter-pill" onclick="location.href='menu.html?category=Desserts'">Desserts</button>
            </div>
        </section>

        <!-- Category Showcases -->
        <div id="varietyShowcase">
            <!-- Dynamically Loaded Sections -->
        </div>

    </main>

    <div id="footerContainer"></div>


    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const session = JSON.parse(localStorage.getItem('user_session'));
            if (!session) { window.location.replace('signin.html'); return; }

            const categories = ['Indian', 'Chinese', 'Korean', 'Japanese', 'American', 'Fast Food', 'Healthy', 'Desserts'];
            const showcase = document.getElementById('varietyShowcase');

            async function loadVarietyShowcase() {
                showcase.innerHTML = '<div style="text-align:center; padding: 3rem;"><i class="fas fa-spinner fa-spin fa-2x" style="color:var(--primary-color)"></i><p>Loading varieties...</p></div>';
                for (const cat of categories) {
                    try {
                        const res = await fetch(`api/foods.php?action=category&category=${encodeURIComponent(cat)}`);
                        const data = await res.json();
                        
                        if (data.success && data.data.length > 0) {
                            if (showcase.querySelector('.fa-spinner')) showcase.innerHTML = '';
                            const section = document.createElement('section');
                            section.className = 'category-showcase';
                            
                            section.innerHTML = `
                                <div class="category-header">
                                    <h2>${cat} <span style="background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Varieties</span></h2>
                                    <a href="menu.html?category=${cat}" class="view-all-btn">Browse All <i class="fas fa-chevron-right"></i></a>
                                </div>
                                <div class="horizontal-scroll">
                                    ${data.data.slice(0, 5).map(food => `
                                        <div class="food-card scroll-card">
                                            <div class="food-image">
                                                <img src="${food.image_url}" alt="${food.name}">
                                                <div class="food-time">${food.delivery_time}</div>
                                            </div>
                                            <div class="food-info">
                                                <div class="food-header">
                                                    <h3>${food.name}</h3>
                                                    <span class="food-rating">${food.rating} ★</span>
                                                </div>
                                                <p class="food-desc">${food.description}</p>
                                                <div class="food-footer">
                                                    <span class="food-price">₹${food.price}</span>
                                                    <div style="display: flex; gap: 8px;">
                                                        <button class="add-btn" onclick="addToCart(${JSON.stringify(food).replace(/"/g, '&quot;')}, this)">Add</button>
                                                        <button class="btn-primary" style="padding: 8px 15px; font-size: 0.9rem;" onclick="orderNowFromData(${JSON.stringify(food).replace(/"/g, '&quot;')})">Order</button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            `;
                            showcase.appendChild(section);
                        }
                    } catch (err) { console.error(err); }
                }
            }

            loadVarietyShowcase();

            window.orderNowFromData = (food) => {
                localStorage.setItem('quick_order_food', JSON.stringify(food));
                window.location.href = 'menu.html?instant_order=true';
            };
        });
    </script>
</body>
</html>
