<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieHub | Your Gourmet Journey Begins Here</title>
    <meta name="description" content="Login to FoodieHub to order your favorite food from the best restaurants. Premium food delivery at your doorstep.">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <!-- Background Overlay -->
        <div class="bg-overlay"></div>
        
        <main class="login-card glass">
            <header class="login-header">
                <div class="logo">
                    <i class="fas fa-utensils"></i>
                    <span>FoodieHub</span>
                </div>
                <h1 class="text-gradient">Welcome Back!</h1>
                <p>Taste the world, one dash at a time.</p>
            </header>

            <form id="loginForm" class="auth-form">
                <!-- Initial Login Step -->
                <div id="initialStep">
                    <div class="input-group">
                        <label for="userName">Full Name</label>
                        <div class="input-wrapper">
                            <i class="far fa-user"></i>
                            <input type="text" id="userName" placeholder="John Doe" required>
                        </div>
                    </div>

                    <div class="input-group" style="margin-top: 1rem;">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <i class="far fa-envelope"></i>
                            <input type="email" id="email" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <button type="button" id="verifyBtn" class="btn-primary" style="margin-top: 2rem; width: 100%;">
                        <span>Verify Email</span>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>

                <!-- OTP Step (Hidden by default) -->
                <div id="otpStep" style="display: none;">
                    <div class="input-group">
                        <div class="label-row">
                            <label for="otp">Enter OTP</label>
                            <span id="resendTimer" class="forgot-link">Resend in 30s</span>
                        </div>
                        <div class="input-wrapper">
                            <i class="fas fa-shield-alt"></i>
                            <input type="text" id="otp" placeholder="Enter 4-digit code" maxlength="4">
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" style="margin-top: 2rem; width: 100%;">
                        <span>Login to Dashboard</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                    
                    <button type="button" id="backToEmail" class="btn-link" style="background:none; border:none; color:var(--text-muted); font-size:0.85rem; margin-top:1rem; cursor:pointer; width:100%;">
                        <i class="fas fa-arrow-left"></i> Change Email
                    </button>
                </div>
            </form>

            <div class="divider">
                <span>or continue with</span>
            </div>

            <div class="social-auth">
                <button class="btn-social google">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google">
                    <span>Google</span>
                </button>
                <button class="btn-social facebook">
                    <i class="fab fa-facebook-f"></i>
                    <span>Facebook</span>
                </button>
            </div>

            <footer class="login-footer">
                <p>New to FoodieHub? <a href="#" id="toggleView">Create an account</a></p>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
