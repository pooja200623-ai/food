<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crave | Discover Food Variety</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=10">
    <style>
        .category-showcase {
            margin-bottom: 5rem;
            animation: fadeUp 0.8s ease backwards;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 2rem;
            padding: 0 0.5rem;
        }
        .category-header h2 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .horizontal-scroll {
            display: flex;
            gap: 2.5rem;
            overflow-x: auto;
            padding: 1.5rem 0.5rem 3rem;
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .horizontal-scroll::-webkit-scrollbar {
            display: none;
        }
        .scroll-card {
            min-width: 320px;
            flex-shrink: 0;
        }
        .view-all-btn {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            padding: 10px 20px;
            border-radius: 50px;
            background: rgba(255, 71, 87, 0.05);
            font-size: 0.95rem;
        }
        .view-all-btn:hover {
            background: var(--primary-color);
            color: white;
            gap: 12px;
        }
        .hero-floating-badge {
            position: absolute;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 15px 25px;
            border-radius: 20px;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: float 4s ease-in-out infinite;
            z-index: 5;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }
    </style>
</head>
<body class="dashboard-body">

    <!-- Navbar -->
    <nav class="dash-nav">
        <div class="nav-brand">
            <i class="fas fa-utensils"></i> Crave
        </div>
        
        <div class="nav-links" style="display: flex; gap: 20px; align-items: center; font-weight: 500; font-size: 0.95rem;">
            <a href="index.html" style="text-decoration: none; color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 5px;">Home</a>
            <a href="menu.html" style="text-decoration: none; color: var(--text-main); transition: 0.3s;" onmouseover="this.style.color='var(--primary-color)'" onmouseout="this.style.color='var(--text-main)'">Our Menu</a>
            <a href="offers.html" style="text-decoration: none; color: var(--text-main); transition: 0.3s;" onmouseover="this.style.color='var(--primary-color)'" onmouseout="this.style.color='var(--text-main)'">Offers</a>
            <a href="cart.html" style="text-decoration: none; color: var(--text-main); transition: 0.3s; position: relative;" onmouseover="this.style.color='var(--primary-color)'" onmouseout="this.style.color='var(--text-main)'">
                Cart <i class="fas fa-shopping-cart"></i>
                <span id="cartCount" style="position: absolute; top: -10px; right: -15px; background: var(--primary-color); color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.75rem; font-weight: bold;">0</span>
            </a>
            <a href="orders.html" style="text-decoration: none; color: var(--text-main); transition: 0.3s;" onmouseover="this.style.color='var(--primary-color)'" onmouseout="this.style.color='var(--text-main)'">Orders</a>
            <a href="profile.html" style="text-decoration: none; color: var(--text-main); transition: 0.3s;" onmouseover="this.style.color='var(--primary-color)'" onmouseout="this.style.color='var(--text-main)'">Profile</a>
            <a href="about.html" style="text-decoration: none; color: var(--text-main); transition: 0.3s;" onmouseover="this.style.color='var(--primary-color)'" onmouseout="this.style.color='var(--text-main)'">About</a>
            <a href="contact.html" style="text-decoration: none; color: var(--text-main); transition: 0.3s;" onmouseover="this.style.color='var(--primary-color)'" onmouseout="this.style.color='var(--text-main)'">Contact</a>
        </div>
        
        <div class="user-profile">
            <span id="userNameDisplay">User</span>
            <div class="user-avatar" id="userAvatar">U</div>
            <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </nav>

    <!-- Hero Banner -->
    <header class="dash-hero">
        <div class="hero-floating-badge" style="top: 25%; left: 10%; animation-delay: 0s;">
            <div style="width: 40px; height: 40px; background: #FFD700; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #000;">
                <i class="fas fa-crown"></i>
            </div>
            <div>
                <div style="font-size: 0.75rem; opacity: 0.8;">Best Choice</div>
                <div>Top Rated Foods</div>
            </div>
        </div>

        <div class="hero-floating-badge" style="bottom: 20%; right: 12%; animation-delay: 1s;">
            <div style="width: 40px; height: 40px; background: #2ed573; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff;">
                <i class="fas fa-bolt"></i>
            </div>
            <div>
                <div style="font-size: 0.75rem; opacity: 0.8;">Super Fast</div>
                <div>30 Min Delivery</div>
            </div>
        </div>

        <div class="hero-content" style="max-width: 900px; position: relative; z-index: 10;">
            <h1 style="font-size: 4.5rem; font-weight: 900; letter-spacing: -2px; line-height: 1; margin-bottom: 1.5rem; text-shadow: 0 10px 30px rgba(0,0,0,0.3);">
                Crave the <span style="background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">World</span>.<br>
                Taste the Best.
            </h1>
            <p style="font-size: 1.5rem; margin-bottom: 2.5rem; opacity: 0.9; font-weight: 400; max-width: 700px; margin-left: auto; margin-right: auto;">
                Explore 80+ handcrafted varieties from global cuisines. <br>
                Authentic flavors, delivered to your doorstep in record time.
            </p>
            <div class="search-bar" style="width: 100%; max-width: 650px; margin: 0 auto; padding: 1rem 2rem; border-radius: 20px; background: rgba(255,255,255,0.95); box-shadow: 0 20px 50px rgba(0,0,0,0.3); border: 1px solid white;">
                <i class="fas fa-search" style="font-size: 1.2rem; color: var(--primary-color);"></i>
                <input type="text" id="searchInput" placeholder="Search for sushi, burgers, or any craving..." style="font-size: 1.1rem; font-weight: 500;">
            </div>
        </div>
    </header>

    <main class="dashboard-container" style="padding-top: 4rem;">
        
        <!-- Quick Variety Access -->
        <section style="margin-bottom: 5rem;">
            <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
                <button class="filter-pill active" onclick="location.href='menu.html'">All Menu</button>
                <button class="filter-pill" onclick="location.href='menu.html?category=Indian'">Indian</button>
                <button class="filter-pill" onclick="location.href='menu.html?category=Chinese'">Chinese</button>
                <button class="filter-pill" onclick="location.href='menu.html?category=American'">American</button>
                <button class="filter-pill" onclick="location.href='menu.html?category=Korean'">Korean</button>
                <button class="filter-pill" onclick="location.href='menu.html?category=Japanese'">Japanese</button>
                <button class="filter-pill" onclick="location.href='menu.html?category=Healthy'">Healthy</button>
                <button class="filter-pill" onclick="location.href='menu.html?category=Desserts'">Desserts</button>
            </div>
        </section>

        <!-- Category Showcases -->
        <div id="varietyShowcase">
            <!-- Dynamically Loaded Sections -->
        </div>

    </main>

    <div id="footerContainer"></div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const session = JSON.parse(localStorage.getItem('user_session'));
            if (!session) { window.location.replace('signin.html'); return; }

            const categories = ['Indian', 'Chinese', 'Korean', 'Japanese', 'American', 'Fast Food', 'Healthy', 'Desserts'];
            const showcase = document.getElementById('varietyShowcase');

            async function loadVarietyShowcase() {
                showcase.innerHTML = '<div style="text-align:center; padding: 3rem;"><i class="fas fa-spinner fa-spin fa-2x" style="color:var(--primary-color)"></i><p>Loading varieties...</p></div>';
                for (const cat of categories) {
                    try {
                        const res = await fetch(`api/foods.php?action=category&category=${encodeURIComponent(cat)}`);
                        const data = await res.json();
                        
                        if (data.success && data.data.length > 0) {
                            if (showcase.querySelector('.fa-spinner')) showcase.innerHTML = '';
                            const section = document.createElement('section');
                            section.className = 'category-showcase';
                            
                            section.innerHTML = `
                                <div class="category-header">
                                    <h2>${cat} <span style="background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Varieties</span></h2>
                                    <a href="menu.html?category=${cat}" class="view-all-btn">Browse All <i class="fas fa-chevron-right"></i></a>
                                </div>
                                <div class="horizontal-scroll">
                                    ${data.data.slice(0, 5).map(food => `
                                        <div class="food-card scroll-card">
                                            <div class="food-image">
                                                <img src="${food.image_url}" alt="${food.name}">
                                                <div class="food-time">${food.delivery_time}</div>
                                            </div>
                                            <div class="food-info">
                                                <div class="food-header">
                                                    <h3>${food.name}</h3>
                                                    <span class="food-rating">${food.rating} ★</span>
                                                </div>
                                                <p class="food-desc">${food.description}</p>
                                                <div class="food-footer">
                                                    <span class="food-price">₹${food.price}</span>
                                                    <div style="display: flex; gap: 8px;">
                                                        <button class="add-btn" onclick="addToCart(${JSON.stringify(food).replace(/"/g, '&quot;')}, this)">Add</button>
                                                        <button class="btn-primary" style="padding: 8px 15px; font-size: 0.9rem;" onclick="orderNowFromData(${JSON.stringify(food).replace(/"/g, '&quot;')})">Order</button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            `;
                            showcase.appendChild(section);
                        }
                    } catch (err) { console.error(err); }
                }
            }

            loadVarietyShowcase();

            window.orderNowFromData = (food) => {
                localStorage.setItem('quick_order_food', JSON.stringify(food));
                window.location.href = 'menu.html?instant_order=true';
            };
        });
    </script>
</body>
</html>
