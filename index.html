<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crave | Discover Food</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body class="dashboard-body">

    <!-- Navbar -->
    <nav class="dash-nav">
        <div class="nav-brand">
            <i class="fas fa-utensils"></i> Crave
        </div>
        
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search for variety foods...">
        </div>

        <div class="user-profile">
            <span id="userNameDisplay">User</span>
            <div class="user-avatar" id="userAvatar">U</div>
            <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </nav>

    <!-- Hero Banner -->
    <header class="dash-hero">
        <div class="hero-content">
            <h1>What are you craving today?</h1>
            <p>Discover the best variety of foods delivered right to your door.</p>
        </div>
    </header>

    <!-- Dashboard Container -->
    <main class="dashboard-container">
        
        <!-- Filters -->
        <div class="filters-section">
            <button class="filter-pill active" data-category="all">All</button>
            <button class="filter-pill" data-category="Indian">Indian</button>
            <button class="filter-pill" data-category="Chinese">Chinese</button>
            <button class="filter-pill" data-category="Korean">Korean</button>
            <button class="filter-pill" data-category="Japanese">Japanese</button>
            <button class="filter-pill" data-category="American">American</button>
            <button class="filter-pill" data-category="Fast Food">Fast Food</button>
            <button class="filter-pill" data-category="Healthy">Healthy</button>
            <button class="filter-pill" data-category="Desserts">Desserts</button>
        </div>

        <!-- Food Grid -->
        <div class="food-grid" id="foodGrid">
            <!-- Loading Skeleton -->
            <div class="food-card skeleton"></div>
            <div class="food-card skeleton"></div>
            <div class="food-card skeleton"></div>
            <div class="food-card skeleton"></div>
        </div>

    </main>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check auth
            const session = JSON.parse(localStorage.getItem('user_session'));
            if (!session) {
                window.location.replace('signin.html');
                return;
            }

            const userNameDisplay = document.getElementById('userNameDisplay');
            const userAvatar = document.getElementById('userAvatar');
            if (userNameDisplay) userNameDisplay.textContent = session.name;
            if (userAvatar) userAvatar.textContent = session.name.charAt(0).toUpperCase();

            // Fetch Foods
            const foodGrid = document.getElementById('foodGrid');
            const filterPills = document.querySelectorAll('.filter-pill');

            function loadFoods(category = 'all') {
                const url = category === 'all' ? 'api/foods.php' : `api/foods.php?action=category&category=${encodeURIComponent(category)}`;
                
                foodGrid.innerHTML = `
                    <div class="food-card skeleton"></div>
                    <div class="food-card skeleton"></div>
                    <div class="food-card skeleton"></div>
                `;

                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        if (data.success && data.data.length > 0) {
                            foodGrid.innerHTML = data.data.map(food => `
                                <div class="food-card">
                                    <div class="food-image">
                                        <img src="${food.image_url}" alt="${food.name}">
                                        <div class="food-time"><i class="far fa-clock"></i> ${food.delivery_time}</div>
                                    </div>
                                    <div class="food-info">
                                        <div class="food-header">
                                            <h3>${food.name}</h3>
                                            <span class="food-rating"><i class="fas fa-star"></i> ${food.rating}</span>
                                        </div>
                                        <p class="food-desc">${food.description}</p>
                                        <div class="food-footer">
                                            <span class="food-price">₹${food.price}</span>
                                            <button class="add-btn"><i class="fas fa-plus"></i> Add</button>
                                        </div>
                                    </div>
                                </div>
                            `).join('');
                        } else {
                            foodGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 2rem; color: #888;">No foods found.</div>';
                        }
                    })
                    .catch(err => {
                        foodGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: red;">Failed to load foods.</div>';
                    });
            }

            // Init Load
            loadFoods('all');

            // Filter Clicks
            filterPills.forEach(pill => {
                pill.addEventListener('click', () => {
                    filterPills.forEach(p => p.classList.remove('active'));
                    pill.classList.add('active');
                    loadFoods(pill.getAttribute('data-category'));
                });
            });

            // Logout
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    localStorage.removeItem('user_session');
                    window.location.href = 'signin.html';
                });
            }
        });
    </script>
</body>
</html>
