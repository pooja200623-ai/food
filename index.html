<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Secure Login</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>
        // Check if user is already logged in (1 time verification rule)
        if (localStorage.getItem('user_session')) {
            window.location.replace('dashboard.html');
        }
    </script>

    <div class="auth-container">
        <!-- Left side: Visual/Branding -->
        <div class="auth-visual">
            <div class="visual-content">
                <h1>Taste the Best</h1>
                <p>Log in to discover premium culinary experiences crafted just for you.</p>
            </div>
            <div class="glass-overlay"></div>
        </div>

        <!-- Right side: Form -->
        <div class="auth-form-wrapper">
            <div class="auth-form-container">
                <div class="form-header">
                    <h2>Welcome Back</h2>
                    <p>Enter your details to receive a one-time password.</p>
                </div>

                <form id="authForm">
                    <!-- Step 1: Name and Email -->
                    <div id="step-1" class="form-step active">
                        <div class="input-group">
                            <i class="far fa-user"></i>
                            <input type="text" id="name" name="name" placeholder="Full Name" required>
                        </div>
                        <div class="input-group">
                            <i class="far fa-envelope"></i>
                            <input type="email" id="email" name="email" placeholder="Email Address" required>
                        </div>
                        <button type="button" id="sendOtpBtn" class="btn-primary">
                            Send OTP <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>

                    <!-- Step 2: OTP Verification -->
                    <div id="step-2" class="form-step">
                        <div class="otp-instruction">
                            <p>We've sent a 4-digit code to <br><strong id="displayEmail"></strong></p>
                        </div>
                        <div class="otp-inputs">
                            <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" required>
                            <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" required>
                            <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" required>
                            <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" required>
                            <input type="hidden" id="otpValue" name="otpValue">
                        </div>
                        <button type="submit" id="verifyBtn" class="btn-primary">
                            Verify & Login <i class="fas fa-check-circle"></i>
                        </button>
                        <a href="#" id="backBtn" class="back-link"><i class="fas fa-arrow-left"></i> Change Email</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
