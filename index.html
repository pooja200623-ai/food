<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crave Luxe | Elevate Your Palate</title>
    <!-- Google Fonts included via style.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=12">
    <style>
        .category-showcase {
            margin-bottom: 10rem;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 3.5rem;
            padding: 0 1rem;
        }
        .category-header h2 {
            font-size: 3.5rem;
            font-weight: 400;
            letter-spacing: -2px;
            font-family: 'DM Serif Display', serif;
        }
        .horizontal-scroll {
            display: flex;
            gap: 3rem;
            overflow-x: auto;
            padding: 2rem 1rem 4rem;
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .horizontal-scroll::-webkit-scrollbar {
            display: none;
        }
        .scroll-card {
            min-width: 360px;
            height: 360px;
            flex-shrink: 0;
            position: relative;
            border-radius: var(--radius-xl);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .card-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
            padding: 3rem 1.5rem 1.5rem;
            width: 100%;
        }
        .view-all-btn {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.4s;
            padding: 12px 28px;
            border-radius: 50px;
            background: rgba(var(--primary-rgb), 0.08);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid rgba(var(--primary-rgb), 0.1);
        }
        .view-all-btn:hover {
            background: var(--gradient-main);
            color: black;
            gap: 18px;
            box-shadow: 0 10px 20px rgba(var(--primary-rgb), 0.3);
        }
        
        /* Luxe Hero specific styles */
        .luxe-hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, #0a0a0c 35%, transparent 100%);
            z-index: 2;
        }
    </style>
</head>
<body class="dashboard-body">

    <!-- Navbar -->
    <nav class="dash-nav"></nav>

    <!-- Cinematic Luxe Hero -->
    <header class="main-hero Luxe-Hero" style="height: 100vh; position: relative; overflow: hidden; display: flex; align-items: center; background: #000;">
        <!-- Background Cinematic Image -->
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;">
            <div class="luxe-hero-overlay" style="background: linear-gradient(to right, #0a0a0c 15%, transparent 100%);"></div>
            <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=2070&auto=format&fit=crop" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.6; filter: contrast(1.1) brightness(0.8);" alt="Gourmet Dish">
        </div>

        <div class="hero-content reveal" style="max-width: 1400px; margin: 0 auto; width: 100%; padding: 0 5rem; position: relative; z-index: 10;">
            <div style="display: inline-block; background: rgba(var(--primary-rgb), 0.15); color: var(--primary-color); padding: 14px 35px; border-radius: 50px; font-weight: 800; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 5px; margin-bottom: 3rem; border: 1px solid rgba(var(--primary-rgb), 0.3); backdrop-filter: blur(10px);">
                ✨ The Elite Gastronomy Experience
            </div>
            
            <h1 style="font-size: 9rem; font-weight: 400; line-height: 0.8; margin-bottom: 3.5rem; letter-spacing: -4px; font-family: 'DM Serif Display', serif; text-shadow: 0 20px 60px rgba(0,0,0,0.5);">
                A Symphony <br>
                of <span style="background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Sublime</span> Flavors.
            </h1>
            
            <p style="font-size: 1.7rem; margin-bottom: 5rem; opacity: 0.8; font-weight: 300; max-width: 650px; line-height: 1.7; color: var(--text-muted); font-family: 'Outfit', sans-serif;">
                Experience the pinnacle of culinary artistry. Over 80+ handcrafted delicacies, 
                curated by master chefs and delivered to your sanctuary.
            </p>

            <div class="search-bar glass-card" style="width: 100%; max-width: 700px; padding: 0.8rem; border-radius: 30px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; box-shadow: 0 30px 80px rgba(0,0,0,0.6); backdrop-filter: blur(25px);">
                <div style="flex: 1; display: flex; align-items: center; padding-left: 2rem;">
                    <i class="fas fa-search" style="font-size: 1.3rem; color: var(--primary-color); opacity: 0.9;"></i>
                    <input type="text" id="searchInput" placeholder="Search for your next obsession..." style="background: transparent; border: none; padding: 20px 25px; font-size: 1.2rem; color: white; width: 100%; outline: none; font-weight: 500; font-family: 'Outfit', sans-serif;">
                </div>
                <button id="heroSearchBtn" class="btn-primary" style="padding: 22px 55px; border-radius: 25px; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; font-size: 0.95rem; background: var(--gradient-main); color: #000; box-shadow: 0 15px 35px rgba(var(--primary-rgb), 0.4); transition: 0.4s; cursor: pointer;" onmouseover="this.style.transform='scale(1.05) translateY(-3px)'" onmouseout="this.style.transform='scale(1) translateY(0)'">
                    Discover <i class="fas fa-arrow-right" style="margin-left: 12px;"></i>
                </button>
            </div>

            <div style="margin-top: 6rem; display: flex; gap: 80px; align-items: center;">
                <div style="display: flex; flex-direction: column;">
                    <span style="font-size: 3rem; font-weight: 400; font-family: 'DM Serif Display', serif; color: var(--accent-color); line-height: 1;">4.9 ★</span>
                    <span style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 3px; color: var(--text-muted); font-weight: 700; margin-top: 8px;">Elite Preference</span>
                </div>
                <div style="width: 1px; height: 60px; background: rgba(255,255,255,0.1);"></div>
                <div style="display: flex; flex-direction: column;">
                    <span style="font-size: 3rem; font-weight: 400; font-family: 'DM Serif Display', serif; color: var(--accent-color); line-height: 1;">70+</span>
                    <span style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 3px; color: var(--text-muted); font-weight: 700; margin-top: 8px;">Masterpiece Varieties</span>
                </div>
            </div>
        </div>
    </header>

    <main class="dashboard-container" style="padding-top: 10rem;">
        
        <!-- Quick Variety Access -->
        <section class="reveal" style="margin-bottom: 10rem; animation-delay: 0.2s;">
            <div style="text-align: center; margin-bottom: 5rem;">
                <span style="background: rgba(var(--primary-rgb), 0.1); color: var(--primary-color); padding: 12px 35px; border-radius: 50px; font-weight: 900; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 4px; border: 1px solid rgba(var(--primary-rgb), 0.2);">
                    <i class="fas fa-fire-alt" style="margin-right: 12px;"></i> Haute Categories
                </span>
            </div>
            <div id="categoryPills" style="display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap;">
                <button class="filter-pill active" onclick="location.href='menu.html'">The Full Menu</button>
                <button class="filter-pill" onclick="location.href='menu.html?category=Indian'">Indian</button>
                <button class="filter-pill" onclick="location.href='menu.html?category=American'">American</button>
                <button class="filter-pill" onclick="location.href='menu.html?category=Chinese'">Chinese</button>
                <button class="filter-pill" onclick="location.href='menu.html?category=Korean'">Korean</button>
                <button class="filter-pill" onclick="location.href='menu.html?category=Japanese'">Japanese</button>
                <button class="filter-pill" onclick="location.href='menu.html?category=Ice%20Creams'">Ice Cream</button>
                <button class="filter-pill" onclick="location.href='menu.html?category=Desserts'">Dessert</button>
            </div>
        </section>

        <!-- Category Showcases -->
        <div id="varietyShowcase">
            <!-- Dynamically Loaded Sections -->
        </div>

    </main>

    <div id="footerContainer"></div>


    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const session = JSON.parse(localStorage.getItem('user_session'));
            if (!session) { window.location.replace('signin.html'); return; }

            const categories = ['Indian', 'American', 'Chinese', 'Korean', 'Japanese', 'Ice Creams', 'Desserts'];
            const showcase = document.getElementById('varietyShowcase');

            async function loadVarietyShowcase() {
                showcase.innerHTML = '<div style="text-align:center; padding: 10rem;"><i class="fas fa-spinner fa-spin fa-3x" style="color:var(--primary-color)"></i><p style="margin-top:20px; font-weight:500; opacity:0.6; letter-spacing:2px; text-transform:uppercase;">Curating Excellence...</p></div>';
                for (const cat of categories) {
                    try {
                        const res = await fetch(`api/foods.php?action=category&category=${encodeURIComponent(cat)}`);
                        const data = await res.json();
                        
                        if (data.success && data.data.length > 0) {
                            if (showcase.querySelector('.fa-spinner')) showcase.innerHTML = '';
                            const section = document.createElement('section');
                            section.className = 'category-showcase';
                            
                            section.innerHTML = `
                                <div class="category-header">
                                    <h2>${cat} <span style="background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Selection</span></h2>
                                    <div style="display: flex; gap: 15px; align-items: center;">
                                        <button onclick="document.getElementById('scroll-${cat}').scrollBy({left: -380, behavior: 'smooth'})" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center;" onmouseover="this.style.background='var(--primary-color)';this.style.color='#000';" onmouseout="this.style.background='rgba(255,255,255,0.05)';this.style.color='white';"><i class="fas fa-chevron-left"></i></button>
                                        <button onclick="document.getElementById('scroll-${cat}').scrollBy({left: 380, behavior: 'smooth'})" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center;" onmouseover="this.style.background='var(--primary-color)';this.style.color='#000';" onmouseout="this.style.background='rgba(255,255,255,0.05)';this.style.color='white';"><i class="fas fa-chevron-right"></i></button>
                                        <a href="menu.html?category=${cat}" class="view-all-btn" style="margin-left: 10px;">Discover All <i class="fas fa-chevron-right"></i></a>
                                    </div>
                                </div>
                                <div class="horizontal-scroll" id="scroll-${cat}">
                                    ${data.data.slice(0, 5).map(food => {
                                        const wishlist = window.getWishlist ? window.getWishlist() : [];
                                        const inWishlist = wishlist.some(item => item.name === food.name);
                                        return `
                                        <div class="food-card scroll-card premium-card">
                                            <img src="${food.image_url}" alt="${food.name}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; border-radius: inherit; pointer-events: none;">
                                            
                                            <div style="position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; z-index: 2;">
                                                <div class="badge-veg" style="background: rgba(0,0,0,0.6); color: var(--accent-color); font-weight: 800; padding: 5px 12px; border-radius: 20px; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1); font-size: 0.8rem;">
                                                    ${food.rating} ★
                                                </div>
                                                <button onclick="viewPicture('${food.image_url}', '${food.name.replace(/'/g, "\\'")}')" style="background: rgba(0,0,0,0.6); color: white; border: 1px solid rgba(255,255,255,0.2); width: 35px; height: 35px; border-radius: 50%; cursor: pointer; backdrop-filter: blur(5px); transition: 0.3s; display: flex; align-items: center; justify-content: center;" title="View Picture">
                                                    <i class="fas fa-expand"></i>
                                                </button>
                                            </div>

                                            <div class="card-overlay" style="position: relative; z-index: 2; padding: 2rem 1.2rem 1.2rem;">
                                                <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 12px;">
                                                    <h3 class="food-name" style="font-family: 'DM Serif Display', serif; font-size: 1.5rem; color: white; line-height: 1.1; text-shadow: 0 2px 10px rgba(0,0,0,0.8); max-width: 70%; margin: 0;">${food.name}</h3>
                                                    <span class="price-tag" style="font-size: 1.3rem; color: var(--primary-color); font-weight: 900; text-shadow: 0 2px 10px rgba(0,0,0,0.8); margin: 0;">₹${food.price}</span>
                                                </div>
                                                <div style="display: flex; gap: 8px; justify-content: space-between; align-items: center;">
                                                    <button class="btn-primary" onclick='orderNowFromData(${JSON.stringify(food).replace(/'/g, "&apos;")})' style="flex: 1; background: var(--gradient-main); color: black; border: none; padding: 12px; border-radius: 12px; font-weight: 900; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 5px 15px rgba(var(--primary-rgb),0.3); cursor: pointer; transition: 0.3s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                                                        Order Now
                                                    </button>
                                                    <button class="add-btn" onclick='addToCart(${JSON.stringify(food).replace(/'/g, "&apos;")}, this)' style="width: 42px; height: 42px; border-radius: 12px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); color: white; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); flex-shrink: 0;" title="Add to Cart">
                                                        <i class="fas fa-cart-plus"></i>
                                                    </button>
                                                    <button class="wishlist-btn" onclick='toggleWishlist(${JSON.stringify(food).replace(/'/g, "&apos;")}, this)' style="width: 42px; height: 42px; border-radius: 12px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); color: white; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); flex-shrink: 0;" title="Wishlist">
                                                        <i class="${inWishlist ? 'fas' : 'far'} fa-heart" style="${inWishlist ? 'color: #ff4757;' : ''}"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                    }).join('')}
                                </div>
                            `;
                            showcase.appendChild(section);
                        }
                    } catch (err) { console.error(err); }
                }
            }

            loadVarietyShowcase();

            window.orderNowFromData = (food) => {
                localStorage.setItem('quick_order_food', JSON.stringify(food));
                window.location.href = 'menu.html?instant_order=true';
            };

            // Search logic
            const searchInput = document.getElementById('searchInput');
            const heroSearchBtn = document.getElementById('heroSearchBtn');

            function executeSearch() {
                const q = searchInput.value.trim();
                if (q) window.location.href = `menu.html?search=${encodeURIComponent(q)}`;
            }

            if (heroSearchBtn) heroSearchBtn.addEventListener('click', executeSearch);
            if (searchInput) searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') executeSearch();
            });

            // Interactive functions
            window.viewPicture = function(url, name) {
                const modal = document.createElement('div');
                modal.style.position = 'fixed';
                modal.style.top = '0';
                modal.style.left = '0';
                modal.style.width = '100%';
                modal.style.height = '100%';
                modal.style.background = 'rgba(0,0,0,0.9)';
                modal.style.zIndex = '9999';
                modal.style.display = 'flex';
                modal.style.flexDirection = 'column';
                modal.style.alignItems = 'center';
                modal.style.justifyContent = 'center';
                modal.style.backdropFilter = 'blur(10px)';
                modal.style.cursor = 'pointer';
                modal.style.animation = 'fadeIn 0.3s ease';
                modal.onclick = () => document.body.removeChild(modal);

                const img = document.createElement('img');
                img.src = url;
                img.style.maxWidth = '90%';
                modal.style.maxHeight = '80%';
                img.style.borderRadius = '20px';
                img.style.boxShadow = '0 30px 60px rgba(0,0,0,0.8)';
                img.style.objectFit = 'contain';

                const title = document.createElement('h3');
                title.textContent = name;
                title.style.color = 'white';
                title.style.marginTop = '2rem';
                title.style.fontFamily = "'DM Serif Display', serif";
                title.style.fontSize = '2rem';
                title.style.letterSpacing = '1px';

                const closeBtn = document.createElement('button');
                closeBtn.innerHTML = '<i class="fas fa-times"></i>';
                closeBtn.style.position = 'absolute';
                closeBtn.style.top = '40px';
                closeBtn.style.right = '40px';
                closeBtn.style.background = 'transparent';
                closeBtn.style.color = 'white';
                closeBtn.style.border = 'none';
                closeBtn.style.fontSize = '2rem';
                closeBtn.style.cursor = 'pointer';

                modal.appendChild(closeBtn);
                modal.appendChild(img);
                modal.appendChild(title);
                document.body.appendChild(modal);
            };
        });
    </script>
</body>
</html>
