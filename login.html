<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Secure Login</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <script>
        // Check if user is already logged in (1 time verification rule)
        if (localStorage.getItem('user_session')) {
            window.location.replace('index.html');
        }
    </script>

    <nav class="dash-nav" style="position: absolute; width: 100%; top: 0; background: transparent; box-shadow: none; z-index: 1000; padding: 1.5rem 4rem;">
        <div class="nav-brand" style="color: white; text-shadow: 1px 1px 5px rgba(0,0,0,0.5); font-size: 2rem;">
            <i class="fas fa-utensils"></i> Crave
        </div>
        <div style="display:flex; gap: 30px; color: white; font-weight: 500; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); font-size: 1.1rem; align-items: center;">
            <a href="#" style="color:white; text-decoration:none; transition: color 0.3s;">Home</a>
            <a href="#" style="color:white; text-decoration:none; transition: color 0.3s;">Our Menu</a>
            <a href="#" style="color:white; text-decoration:none; transition: color 0.3s;">About Us</a>
            <a href="#" style="color:white; text-decoration:none; transition: color 0.3s;">Contact</a>
            <span style="background: var(--primary-color); padding: 8px 20px; border-radius: 50px; cursor:pointer;">Login / Sign Up</span>
        </div>
    </nav>

    <div class="auth-container">
        <!-- Left side: Visual/Branding -->
        <div class="auth-visual">
            <div class="visual-content">
                <h1>Taste the Best</h1>
                <p>Log in to discover premium culinary experiences crafted just for you.</p>
            </div>
            <div class="glass-overlay"></div>
        </div>

        <!-- Right side: Form -->
        <div class="auth-form-wrapper">
            <div class="auth-form-container">
                <div class="form-header">
                    <h2>Welcome Back</h2>
                    <p>Enter your details to access your account.</p>
                </div>

                <form id="authForm">
                    <!-- Step 1: Name and Email -->
                    <div id="step-1" class="form-step active">
                        <div style="margin-bottom: 1rem; text-align: left;">
                            <label for="name" style="font-weight: bold; display: block; margin-bottom: 0.5rem; color: var(--text-main);">Name Text Box:</label>
                            <div class="input-group">
                                <i class="far fa-user"></i>
                                <input type="text" id="name" name="name" placeholder="Enter Full Name" required>
                            </div>
                        </div>
                        
                        <div style="margin-bottom: 1rem; text-align: left;">
                            <label for="email" style="font-weight: bold; display: block; margin-bottom: 0.5rem; color: var(--text-main);">Email Text Box:</label>
                            <div class="input-group">
                                <i class="far fa-envelope"></i>
                                <input type="email" id="email" name="email" placeholder="Enter Email Address" required>
                            </div>
                        </div>
                        
                        <input type="submit" id="loginBtn" class="btn-primary" value="Submit Button" style="display: block; width: 100%; font-size: 1.2rem; font-weight: bold; margin-top: 1.5rem; cursor: pointer;">
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
