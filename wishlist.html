<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxe Wishlist | Your Saved Masterpieces</title>
    <!-- Fonts and style via style.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=16">
    <style>
        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2.5rem;
            margin-top: 3rem;
            padding-bottom: 5rem;
        }
        .food-card {
            height: 320px;
            background-size: cover;
            background-position: center;
            position: relative;
            border-radius: var(--radius-xl);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 0;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            animation: cardFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .food-card.removing {
            opacity: 0;
            transform: scale(0.9) translateY(20px);
        }
        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
            padding: 3rem 1.5rem 1.5rem;
            width: 100%;
        }
        .wishlist-btn:hover {
            background: #ff4757 !important;
            color: white !important;
            border-color: #ff4757 !important;
            transform: scale(1.1);
        }
    </style>
</head>
<body class="dashboard-body">

    <!-- Navbar -->
    <nav class="dash-nav"></nav>

    <main class="dashboard-container reveal" style="padding-top: 15rem; padding-bottom: 12rem; min-height: 80vh;">
        <!-- Wishlist Header -->
        <header style="margin-bottom: 6rem; text-align: left;">
            <div style="background: rgba(255, 71, 87, 0.1); color: #ff4757; padding: 10px 25px; border-radius: 50px; display: inline-block; font-weight: 900; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 2rem; border: 1px solid rgba(255, 71, 87, 0.2);">
                💖 Your Sanctuary of Desires
            </div>
            <div style="display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 20px;">
                <div>
                    <h1 style="font-size: 5rem; font-weight: 400; color: white; margin-bottom: 1rem; font-family: 'DM Serif Display', serif; letter-spacing: -2px;">Your Wishlist</h1>
                    <p style="color: var(--text-muted); font-size: 1.2rem; font-weight: 300;" id="wishlistItemCount">Reviewing your saved masterpieces...</p>
                </div>
                <a href="menu.html" style="text-decoration: none; display: flex; align-items: center; gap: 12px; color: var(--primary-color); font-weight: 800; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; border: 1px solid var(--primary-color); padding: 15px 35px; border-radius: 50px; transition: 0.4s;" onmouseover="this.style.background='var(--primary-color)';this.style.color='black';this.style.boxShadow='0 10px 20px rgba(255, 140, 66, 0.2)'" onmouseout="this.style.background='transparent';this.style.color='var(--primary-color)';this.style.boxShadow='none'">
                    <i class="fas fa-plus"></i> Add More Masterpieces
                </a>
            </div>
        </header>

        <!-- Wishlist Content -->
        <div id="wishlistContent">
            <div id="wishlistGrid" class="wishlist-grid">
                <!-- Dynamically filled -->
            </div>
        </div>

        <!-- Empty Wishlist State -->
        <div id="emptyWishlistMessage" style="display: none; background: rgba(255,255,255,0.02); padding: 10rem 4rem; border-radius: var(--radius-xl); text-align: center; border: 1px solid rgba(255,255,255,0.05);">
            <i class="far fa-heart" style="font-size: 6rem; color: rgba(255,71,87,0.1); margin-bottom: 3rem;"></i>
            <h2 style="font-family: 'DM Serif Display', serif; font-size: 3.5rem; margin-bottom: 1.5rem;">Sanctuary of Desire is Empty</h2>
            <p style="color: var(--text-muted); margin-bottom: 4.5rem; font-size: 1.4rem; font-weight: 300;">Your collections are waiting to receive culinary masterpieces.</p>
            <a href="menu.html" class="btn-primary" style="text-decoration: none; padding: 20px 50px; border-radius: 25px; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; background: var(--gradient-main); color: #000;">Discover Menu</a>
        </div>
    </main>

    <!-- Luxe Quick Order Modal -->
    <div id="quickOrderModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); align-items: center; justify-content: center; padding: 20px;">
        <div style="width: 100%; max-width: 600px; padding: 4.5rem; border-radius: var(--radius-xl); position: relative; background: #161618; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 50px 100px rgba(0,0,0,0.8); animation: modalIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);">
            <button onclick="closeQuickOrder()" style="position: absolute; top: 35px; right: 35px; border: none; background: rgba(255,255,255,0.05); width: 45px; height: 45px; border-radius: 50%; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.4s; color: white;" onmouseover="this.style.background='var(--primary-color)';this.style.transform='rotate(90deg)'" onmouseout="this.style.background='rgba(255,255,255,0.05)';this.style.transform='rotate(0deg)'">&times;</button>
            
            <div style="text-align: center; margin-bottom: 4rem;">
                <h2 id="modalFoodName" style="font-size: 3rem; font-weight: 400; margin-bottom: 1rem; color: white; letter-spacing: -1.5px; font-family: 'DM Serif Display', serif;">Food Name</h2>
                <p style="color: var(--text-muted); font-size: 1.1rem; font-weight: 400; letter-spacing: 1px; text-transform: uppercase; opacity: 0.6;">Indulge in Instant Excellence</p>
            </div>

            <div style="margin-bottom: 3rem;">
                <label style="display: block; margin-bottom: 1.5rem; font-weight: 700; font-size: 0.8rem; color: var(--primary-color); text-transform: uppercase; letter-spacing: 3px;">The Sanctuary Address</label>
                <div style="position: relative;">
                    <i class="fas fa-map-marker-alt" style="position: absolute; left: 20px; top: 22px; color: var(--accent-color); font-size: 1.1rem; opacity: 0.8;"></i>
                    <textarea id="quickAddress" placeholder="Where shall we deliver perfection?..." style="width: 100%; padding: 20px 20px 20px 55px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); font-family: 'Outfit', sans-serif; resize: none; height: 120px; font-size: 1.1rem; transition: 0.4s; background: rgba(255,255,255,0.03); color: white; outline: none;" onfocus="this.style.borderColor='var(--primary-color)';this.style.background='rgba(255,255,255,0.05)';this.style.boxShadow='0 0 30px rgba(255,140,66,0.1)'" onblur="this.style.borderColor='rgba(255,255,255,0.05)';this.style.background='rgba(255,255,255,0.03)';this.style.boxShadow='none'"></textarea>
                </div>
            </div>

            <div style="margin-bottom: 4rem;">
                <label style="display: block; margin-bottom: 1.5rem; font-weight: 700; font-size: 0.8rem; color: var(--primary-color); text-transform: uppercase; letter-spacing: 3px;">Payment Protocol</label>
                <div style="position: relative;">
                    <span id="quickPaymentIcon" style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--accent-color); font-size: 1.2rem; pointer-events: none;">
                        <i class="fas fa-money-bill-wave"></i>
                    </span>
                    <select id="quickPaymentValue" onchange="updateQuickPaymentIcon(this)" style="
                        width: 100%;
                        padding: 18px 60px;
                        border: 1px solid rgba(255,255,255,0.05);
                        border-radius: 20px;
                        font-family: 'Outfit', sans-serif;
                        font-size: 1.1rem;
                        font-weight: 600;
                        color: white;
                        background: rgba(255,255,255,0.03);
                        appearance: none;
                        outline: none;
                        cursor: pointer;
                        transition: 0.4s;
                    "
                    onfocus="this.style.borderColor='var(--primary-color)';"
                    onblur="this.style.borderColor='rgba(255,255,255,0.05)';">
                        <option value="cod">🏠 Cash on Delivery</option>
                        <option value="card">💳 Elite Credit / Debit</option>
                        <option value="upi">📱 Secure UPI</option>
                        <option value="wallet">👛 Luxe Wallet</option>
                    </select>
                    <span style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.3); pointer-events: none;">
                        <i class="fas fa-chevron-down"></i>
                    </span>
                </div>
            </div>

            <div style="background: rgba(255,255,255,0.02); padding: 2.5rem; border-radius: 25px; margin-bottom: 4rem; border: 1px solid rgba(255,255,255,0.05);">
                <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; font-size: 1.1rem; font-weight: 400; opacity: 0.6;">
                    <span>Selection Value</span>
                    <span id="modalItemPrice" style="color: white; font-weight: 700;">₹0</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 1.5rem; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 1.5rem; font-size: 1.6rem; font-weight: 400; font-family: 'DM Serif Display', serif;">
                    <span>Total Indulgence</span>
                    <span id="modalTotalPrice" style="color: var(--accent-color); font-size: 2.2rem; font-weight: 400;">₹0</span>
                </div>
            </div>

            <button id="confirmOrderBtn" class="btn-primary" style="width: 100%; padding: 25px; border-radius: 25px; font-size: 1.1rem; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; background: var(--gradient-main); color: #000; box-shadow: 0 20px 40px rgba(255, 140, 66, 0.4); transition: 0.5s;" onmouseover="this.style.transform='translateY(-5px) scale(1.02)'" onmouseout="this.style.transform='translateY(0) scale(1)'">
                Finalize Indulgence <i class="fas fa-arrow-right" style="margin-left: 15px;"></i>
            </button>
        </div>
    </div>

    <div id="footerContainer"></div>
    <div id="toastContainer"></div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const session = JSON.parse(localStorage.getItem('user_session'));
            if (!session) { window.location.replace('signin.html'); return; }

            const wishlistGrid = document.getElementById('wishlistGrid');
            const wishlistContent = document.getElementById('wishlistContent');
            const emptyWishlistMessage = document.getElementById('emptyWishlistMessage');
            const countEl = document.getElementById('wishlistItemCount');

            // Render Wishlist Page Contents
            window.renderWishlist = function() {
                const wishlist = getWishlist();
                if (wishlist.length === 0) {
                    wishlistContent.style.display = 'none';
                    emptyWishlistMessage.style.display = 'block';
                    countEl.textContent = 'No saved masterpieces in your sanctuary.';
                    return;
                }

                wishlistContent.style.display = 'block';
                emptyWishlistMessage.style.display = 'none';
                countEl.textContent = `You have secured ${wishlist.length} gourmet masterpiece${wishlist.length > 1 ? 's' : ''} in your sanctuary.`;

                wishlistGrid.innerHTML = wishlist.map((food, i) => `
                    <div class="food-card premium-card" id="wishlist-card-${food.name.replace(/\s+/g, '-').replace(/'/g, '')}" style="background-image: url('${food.image_url}'); animation-delay: ${i * 0.05}s;">
                        
                        <div style="position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; z-index: 2;">
                            <div class="badge-veg" style="background: rgba(0,0,0,0.6); color: var(--accent-color); font-weight: 800; padding: 5px 12px; border-radius: 20px; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1); font-size: 0.8rem;">
                                ${food.rating} ★
                            </div>
                            <button onclick="viewPicture('${food.image_url}', '${food.name.replace(/'/g, "\\'")}')" style="background: rgba(0,0,0,0.6); color: white; border: 1px solid rgba(255,255,255,0.2); width: 35px; height: 35px; border-radius: 50%; cursor: pointer; backdrop-filter: blur(5px); transition: 0.3s; display: flex; align-items: center; justify-content: center;" title="View Picture">
                                <i class="fas fa-expand"></i>
                            </button>
                        </div>

                        <div class="card-overlay" style="position: relative; z-index: 2; padding: 2rem 1.2rem 1.2rem;">
                            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 12px;">
                                <h3 class="food-name" style="font-family: 'DM Serif Display', serif; font-size: 1.5rem; color: white; line-height: 1.1; text-shadow: 0 2px 10px rgba(0,0,0,0.8); max-width: 70%; margin: 0;">${food.name}</h3>
                                <span class="price-tag" style="font-size: 1.3rem; color: var(--primary-color); font-weight: 900; text-shadow: 0 2px 10px rgba(0,0,0,0.8); margin: 0;">₹${food.price}</span>
                            </div>
                            <div style="display: flex; gap: 8px; justify-content: space-between; align-items: center;">
                                <button class="btn-primary" onclick='openQuickOrder(${JSON.stringify(food).replace(/'/g, "&apos;")})' style="flex: 1; background: var(--gradient-main); color: black; border: none; padding: 12px; border-radius: 12px; font-weight: 900; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 5px 15px rgba(255,140,66,0.3); cursor: pointer; transition: 0.3s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                                    Order Now
                                </button>
                                <button class="add-btn" onclick='addToCart(${JSON.stringify(food).replace(/'/g, "&apos;")}, this)' style="width: 42px; height: 42px; border-radius: 12px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); color: white; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); flex-shrink: 0;" title="Add to Cart">
                                    <i class="fas fa-cart-plus"></i>
                                </button>
                                <button class="wishlist-btn" onclick='animateRemoveWishlist(${JSON.stringify(food).replace(/'/g, "&apos;")}, this)' style="width: 42px; height: 42px; border-radius: 12px; background: #ff4757; border: 1px solid #ff4757; color: white; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); flex-shrink: 0;" title="Remove from Wishlist">
                                    <i class="fas fa-heart"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            };

            // Custom Smooth Animation on Remove
            window.animateRemoveWishlist = function(food, btn) {
                const safeName = food.name.replace(/\s+/g, '-').replace(/'/g, '');
                const card = document.getElementById(`wishlist-card-${safeName}`);
                if (card) {
                    card.classList.add('removing');
                    setTimeout(() => {
                        window.toggleWishlist(food, btn);
                    }, 400); // Let fade transition finish
                } else {
                    window.toggleWishlist(food, btn);
                }
            };

            renderWishlist();

            // Modal Logic
            let selectedFood = null;

            window.updateQuickPaymentIcon = function(sel) {
                const iconMap = { cod: 'fa-money-bill-wave', card: 'fa-credit-card', upi: 'fa-mobile-alt', wallet: 'fa-wallet' };
                const val = sel.value;
                document.getElementById('quickPaymentIcon').innerHTML = `<i class="fas ${iconMap[val]}"></i>`;
            };

            window.openQuickOrder = (food) => {
                selectedFood = food;
                document.getElementById('modalFoodName').textContent = food.name;
                document.getElementById('modalItemPrice').textContent = `₹${food.price}`;
                document.getElementById('modalTotalPrice').textContent = `₹${food.price}`;
                document.getElementById('quickOrderModal').style.display = 'flex';
                document.getElementById('quickPaymentValue').value = 'cod';
                updateQuickPaymentIcon(document.getElementById('quickPaymentValue'));
            };

            window.closeQuickOrder = () => {
                document.getElementById('quickOrderModal').style.display = 'none';
            };

            document.getElementById('confirmOrderBtn').addEventListener('click', async () => {
                const address = document.getElementById('quickAddress').value.trim();
                const payment = document.getElementById('quickPaymentValue').value;
                
                if(!address) {
                    showToast('The Sanctuary Address is required', 'error');
                    return;
                }
                
                const btn = document.getElementById('confirmOrderBtn');
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Finalizing Perfection...';

                try {
                    const res = await fetch('api/orders.php?action=place_order', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            email: session.email,
                            cart: [{...selectedFood, quantity: 1}],
                            address: address,
                            payment_method: payment,
                            total_price: selectedFood.price
                        })
                    });
                    const data = await res.json();
                    if(data.success) {
                        showToast('Indulgence Secured Successfully', 'success');
                        closeQuickOrder();
                        setTimeout(() => window.location.href = 'orders.html', 1500);
                    } else {
                        showToast(data.message || 'Error securing indulgence', 'error');
                        btn.disabled = false;
                        btn.innerHTML = 'Finalize Indulgence <i class="fas fa-arrow-right" style="margin-left: 15px;"></i>';
                    }
                } catch (err) {
                    showToast('Connection interrupted', 'error');
                    btn.disabled = false;
                }
            });

            // Picture Lightbox
            window.viewPicture = function(url, name) {
                const modal = document.createElement('div');
                modal.style.position = 'fixed';
                modal.style.top = '0';
                modal.style.left = '0';
                modal.style.width = '100%';
                modal.style.height = '100%';
                modal.style.background = 'rgba(0,0,0,0.9)';
                modal.style.zIndex = '9999';
                modal.style.display = 'flex';
                modal.style.flexDirection = 'column';
                modal.style.alignItems = 'center';
                modal.style.justifyContent = 'center';
                modal.style.backdropFilter = 'blur(10px)';
                modal.style.cursor = 'pointer';
                modal.onclick = () => document.body.removeChild(modal);

                const img = document.createElement('img');
                img.src = url;
                img.style.maxWidth = '90%';
                modal.style.maxHeight = '80%';
                img.style.borderRadius = '20px';
                img.style.boxShadow = '0 30px 60px rgba(0,0,0,0.8)';
                img.style.objectFit = 'contain';

                const title = document.createElement('h3');
                title.textContent = name;
                title.style.color = 'white';
                title.style.marginTop = '2rem';
                title.style.fontFamily = "'DM Serif Display', serif";
                title.style.fontSize = '2rem';
                title.style.letterSpacing = '1px';

                const closeBtn = document.createElement('button');
                closeBtn.innerHTML = '<i class="fas fa-times"></i>';
                closeBtn.style.position = 'absolute';
                closeBtn.style.top = '40px';
                closeBtn.style.right = '40px';
                closeBtn.style.background = 'transparent';
                closeBtn.style.color = 'white';
                closeBtn.style.border = 'none';
                closeBtn.style.fontSize = '2rem';
                closeBtn.style.cursor = 'pointer';

                modal.appendChild(closeBtn);
                modal.appendChild(img);
                modal.appendChild(title);
                document.body.appendChild(modal);
            };
        });
    </script>
</body>
</html>
