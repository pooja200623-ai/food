<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crave Luxe | Secure Entrance</title>
    <!-- Fonts via style.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=14">
    <style>
        body {
            background: #0a0a0c;
            height: 100vh;
            overflow: hidden;
        }
        .auth-container {
            display: flex;
            height: 100vh;
        }
        .auth-visual {
            flex: 1.3;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .visual-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to left, #0a0a0c 5%, transparent 60%),
                        linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 40%);
            z-index: 2;
        }
        .auth-visual img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
            filter: contrast(1.1) brightness(0.7);
        }
        .auth-form-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            position: relative;
            z-index: 10;
        }
        .auth-form-container {
            width: 100%;
            max-width: 480px;
            padding: 4.5rem;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--radius-xl);
            backdrop-filter: blur(25px);
            box-shadow: 0 40px 80px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,140,66,0.05);
            animation: float 8s ease-in-out infinite;
            position: relative;
        }
        .auth-form-container::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            background: linear-gradient(45deg, var(--primary-color), transparent, var(--accent-color));
            z-index: -1;
            border-radius: inherit;
            opacity: 0.1;
            animation: pulse-soft 4s infinite alternate;
        }
        .input-group input {
            background: rgba(255,255,255,0.03) !important;
            border: 1px solid rgba(255,255,255,0.08) !important;
            color: white !important;
            transition: all 0.4s ease !important;
        }
        .input-group input:focus {
            border-color: var(--primary-color) !important;
            background: rgba(255,255,255,0.06) !important;
            box-shadow: 0 0 25px rgba(255,140,66,0.15), inset 0 0 10px rgba(255,140,66,0.05) !important;
            transform: translateY(-2px);
        }
        .form-header h2 {
            font-family: 'DM Serif Display', serif;
            font-size: 3rem;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }
        @media (max-width: 1100px) {
            .auth-visual { display: none; }
            .auth-form-wrapper { flex: 1; padding: 2rem; }
        }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('user_session')) {
            window.location.replace('index.html');
        }
    </script>

    <div class="auth-container">
        <!-- Cinematic Side -->
        <div class="auth-visual">
            <div class="visual-overlay"></div>
            <img src="https://images.unsplash.com/photo-1467003909585-2f8a72700288?q=80&w=1974&auto=format&fit=crop" alt="Luxe Dining">
            
            <div class="visual-content" style="position: absolute; z-index: 10; padding: 5rem; text-align: left; bottom: 10%; left: 0; width: 100%;">
                <div style="background: rgba(255, 140, 66, 0.15); color: var(--primary-color); padding: 12px 30px; border-radius: 50px; display: inline-block; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 2rem; border: 1px solid rgba(255, 140, 66, 0.3); backdrop-filter: blur(10px);">
                    ✨ Experience Excellence
                </div>
                <h1 style="font-size: 5.5rem; line-height: 1; margin-bottom: 2rem; letter-spacing: -3px; font-family: 'DM Serif Display', serif;">Taste the <br><span style="background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Sublime</span>.</h1>
                <p style="font-size: 1.5rem; max-width: 550px; opacity: 0.7; line-height: 1.6; font-weight: 300;">Join a private circle of food connoisseurs and discover culinary masterpieces crafted for the modern palate.</p>
            </div>
        </div>

        <!-- Form Side -->
        <div class="auth-form-wrapper">
            <div class="auth-form-container reveal">
                
                <form id="authForm" autocomplete="off">
                    <!-- STEP 1: Entrance -->
                    <div id="step-1" class="auth-step active">
                        <div class="form-header" style="text-align: center; margin-bottom: 3.5rem;">
                            <h2>Welcome Back</h2>
                            <p style="opacity: 0.5; font-size: 1.1rem; font-weight: 300;">Initiate your secure dining session.</p>
                        </div>
                        
                        <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                            <div class="input-group">
                                <i class="far fa-user"></i>
                                <input type="text" id="name" name="name" placeholder="Full Name" required>
                            </div>
                            
                            <div class="input-group">
                                <i class="far fa-envelope"></i>
                                <input type="email" id="email" name="email" placeholder="Email Address" required>
                            </div>
                            
                            <button type="button" id="loginBtn" class="btn-primary" style="width: 100%; padding: 22px; border-radius: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; background: var(--gradient-main); color: #000; box-shadow: 0 15px 35px rgba(255,140,66,0.25); margin-top: 1rem; transition: all 0.4s ease; border: 1px solid rgba(255,255,255,0.2);" onmouseover="this.style.transform='translateY(-5px) scale(1.02)'; this.style.boxShadow='0 25px 45px rgba(255,140,66,0.4)'" onmouseout="this.style.transform='translateY(0) scale(1)'; this.style.boxShadow='0 15px 35px rgba(255,140,66,0.25)'">
                                Login <i class="fas fa-sign-in-alt" style="margin-left: 10px;"></i>
                            </button>
                        </div>
                        
                        <div style="text-align: center; margin-top: 3rem; opacity: 0.4; font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; font-weight: 700;">
                            Secured by Crave Concierge
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
