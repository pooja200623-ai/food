<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Secure Login</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
    <script>
        if (localStorage.getItem('user_session')) {
            window.location.replace('index.html');
        }
    </script>

    <nav class="dash-nav" style="position: absolute; width: 100%; top: 0; background: transparent; box-shadow: none; z-index: 1000; padding: 1.5rem 4rem;">
        <div class="nav-brand" style="color: white; text-shadow: 1px 1px 5px rgba(0,0,0,0.5); font-size: 2rem;">
            <i class="fas fa-utensils"></i> Crave
        </div>
        <div style="display:flex; gap: 30px; color: white; font-weight: 500; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); font-size: 1.1rem; align-items: center;">
            <a href="index.html" style="color:white; text-decoration:none; transition: color 0.3s;">Home</a>
            <a href="index.html#menu" style="color:white; text-decoration:none; transition: color 0.3s;">Our Menu</a>
            <a href="index.html#about" style="color:white; text-decoration:none; transition: color 0.3s;">About Us</a>
            <a href="index.html#contact" style="color:white; text-decoration:none; transition: color 0.3s;">Contact</a>
        </div>
    </nav>

    <div class="auth-container">
        <!-- Left side: Visual/Branding -->
        <div class="auth-visual">
            <div class="visual-content">
                <h1>Taste the Best</h1>
                <p>Log in to discover premium culinary experiences crafted just for you.</p>
            </div>
            <div class="glass-overlay"></div>
        </div>

        <!-- Right side: Form -->
        <div class="auth-form-wrapper">
            <div class="auth-form-container">
                
                <form id="authForm" autocomplete="off">
                    <!-- STEP 1: Enter Details -->
                    <div id="step-1" class="auth-step active">
                        <div class="form-header">
                            <h2>Welcome Back</h2>
                            <p>Enter your details to receive a verification code.</p>
                        </div>
                        
                        <div style="display: flex; flex-direction: column; gap: 1.2rem; margin-top: 2rem;">
                            <div class="input-group">
                                <i class="far fa-user"></i>
                                <input type="text" id="name" name="name" placeholder="Full Name" required>
                            </div>
                            
                            <div class="input-group">
                                <i class="far fa-envelope"></i>
                                <input type="email" id="email" name="email" placeholder="Email Address" required>
                            </div>
                            
                            <button type="button" id="sendOtpBtn" class="btn-primary" style="width: 100%; margin-top: 0.5rem;">
                                Get Verification Code <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>

                    <!-- STEP 2: Enter OTP -->
                    <div id="step-2" class="auth-step" style="display: none;">
                        <div class="form-header">
                            <button type="button" id="backBtn" style="background: none; border: none; color: var(--primary-color); cursor: pointer; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 5px; padding: 0;">
                                <i class="fas fa-arrow-left"></i> Change Email
                            </button>
                            <h2>Verify OTP</h2>
                            <p>We've sent a 4-digit code to <strong id="displayEmail" style="color: var(--text-main);">email@example.com</strong></p>
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 1.5rem; margin-top: 2rem; align-items: center;">
                            <div class="otp-container" style="width: 100%;">
                                <input type="text" id="otpDisplay" maxlength="4" placeholder="0 0 0 0" style="
                                    width: 100%;
                                    letter-spacing: 20px;
                                    text-align: center;
                                    font-size: 2rem;
                                    font-weight: 800;
                                    padding: 15px;
                                    border: 2px solid #eee;
                                    border-radius: 15px;
                                    color: var(--primary-color);
                                    outline: none;
                                    transition: 0.3s;
                                " onfocus="this.style.borderColor='var(--primary-color)'" onblur="this.style.borderColor='#eee'">
                                <input type="hidden" id="otpValue">
                            </div>

                            <button type="submit" id="verifyBtn" class="btn-primary" style="width: 100%;">
                                Verify & Login <i class="fas fa-check-double"></i>
                            </button>
                            
                            <p style="font-size: 0.85rem; color: #888;">
                                Didn't receive code? <a href="#" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Resend Code</a>
                            </p>
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
